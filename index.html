<meta name="description" content="Demonstração da fila de atendimento da Kayan: cada pedido com protocolo, prazo e responsável. Organizações, pessoas e conversas fictícias; atendimento automático simulado.">

<style>
/* ==========================================================================
   Kayan · demo web — estilo (DEV-UI, rodada 4).
   Cópia fiel do CSS do protótipo aprovado (design/prototipo.html), sem
   alteração; os acréscimos da demo funcional ficam no fim, marcados.
   Fontes: um único @import do Google Fonts (Archivo + IBM Plex Mono).
   ========================================================================== */
@import url("https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap");
/* ==========================================================================
   Kayan · Fila de atendimento — protótipo clicável (rodada 4)
   Tokens: claro em :root; escuro em @media + [data-theme="dark"].
   Acento por vertical em [data-v]. Detalhes em design/DESIGN_SYSTEM.md.
   ========================================================================== */
:root{
  color-scheme:light;
  /* neutros frios, levemente puxados para o azul-ardósia */
  --bg:#F1F3F5; --surface:#FFFFFF; --surface-2:#F6F7F9; --surface-3:#E9ECEF;
  --rail:#F6F7F9; --chat-bg:#F3F5F7; --field-bg:#FFFFFF;
  --line:#DCE0E5; --line-strong:#BEC5CD; --field-line:#7E8791;
  --ink:#14181C; --ink-2:#3E4750; --ink-3:#5B6570; --ink-faint:#8A939C;
  --ia-bg:#E9EDF2;
  /* estados de prazo — cor semântica, separada do acento */
  --crit:#C8322C; --crit-ink:#A1241F; --crit-bg:#FCECEB; --crit-line:#EFB8B4;
  --warn:#B87400; --warn-ink:#7A4700; --warn-bg:#FFF2D9; --warn-line:#EDC57A;
  --ok:#2B8A4E;   --ok-ink:#1D6A3A;   --ok-bg:#E6F3EA;   --ok-line:#A9D5B7;
  /* gráficos: slots 1–3 da paleta validada (dataviz) */
  --chart-1:#2a78d6; --chart-2:#eb6834; --chart-3:#1baf7a;
  /* marca Kayan (neutra; o acento é da vertical) */
  --brand:#14181C; --brand-on:#FFFFFF;
  --phone-body:#1B2025;
  --shadow-float:0 12px 32px rgba(20,24,28,.14), 0 2px 6px rgba(20,24,28,.08);
  /* acento padrão = Educação (anil) */
  --acc:#2E4A9E; --acc-fill:#2E4A9E; --acc-fill-hover:#243B80; --acc-on:#FFFFFF;
  --acc-soft:#E8ECF7; --acc-soft-ink:#25408A; --acc-line:#B9C4E6;
  --focus:var(--acc);
  /* tipografia */
  --font-ui:"Archivo","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --fs-xs:.75rem; --fs-sm:.8125rem; --fs-md:.9375rem; --fs-lg:1.0625rem;
  --fs-xl:1.375rem; --fs-2xl:1.75rem; --fs-3xl:2.5rem;
  --cond:87.5%; --display:78%;
  /* espaçamento (base 4) e raios */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px;
  --r-1:4px; --r-2:6px; --r-3:8px; --r-4:14px;
  --top-h:56px;
}
[data-v="edu"]{--acc:#2E4A9E;--acc-fill:#2E4A9E;--acc-fill-hover:#243B80;--acc-on:#FFFFFF;--acc-soft:#E8ECF7;--acc-soft-ink:#25408A;--acc-line:#B9C4E6}
[data-v="imob"]{--acc:#1E6A4F;--acc-fill:#1E6A4F;--acc-fill-hover:#175640;--acc-on:#FFFFFF;--acc-soft:#E3F0EA;--acc-soft-ink:#185A42;--acc-line:#A9CFBE}
[data-v="cond"]{--acc:#6B3D8A;--acc-fill:#6B3D8A;--acc-fill-hover:#583172;--acc-on:#FFFFFF;--acc-soft:#F0E9F5;--acc-soft-ink:#5A3176;--acc-line:#D2BEE0}
[data-v="saude"]{--acc:#0D6674;--acc-fill:#0D6674;--acc-fill-hover:#0A5460;--acc-on:#FFFFFF;--acc-soft:#E0F0F2;--acc-soft-ink:#0A5663;--acc-line:#A6D3DA}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1215; --surface:#171B1F; --surface-2:#1D2227; --surface-3:#262C32;
    --rail:#13171A; --chat-bg:#12161A; --field-bg:#1D2227;
    --line:#2B3239; --line-strong:#3C454E; --field-line:#6B757F;
    --ink:#EEF1F4; --ink-2:#C3CAD1; --ink-3:#9AA4AE; --ink-faint:#6B757F;
    --ia-bg:#232A31;
    --crit:#E5544D; --crit-ink:#F7B9B4; --crit-bg:#3B1A19; --crit-line:#6E2F2B;
    --warn:#E8A42A; --warn-ink:#F6D190; --warn-bg:#372A10; --warn-line:#6B5218;
    --ok:#4DB872;   --ok-ink:#9FDDB3;   --ok-bg:#15291C;   --ok-line:#2C5A3B;
    --chart-1:#3987e5; --chart-2:#d95926; --chart-3:#199e70;
    --brand:#EEF1F4; --brand-on:#0F1215;
    --phone-body:#2A3036;
    --shadow-float:0 12px 32px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
    --acc:#A3B5F0; --acc-fill:#3A57B8; --acc-fill-hover:#4867C9; --acc-on:#FFFFFF;
    --acc-soft:#1E2640; --acc-soft-ink:#C4D0F7; --acc-line:#3A4A7A;
  }
  :root:not([data-theme="light"]) [data-v="edu"]{--acc:#A3B5F0;--acc-fill:#3A57B8;--acc-fill-hover:#4867C9;--acc-on:#FFFFFF;--acc-soft:#1E2640;--acc-soft-ink:#C4D0F7;--acc-line:#3A4A7A}
  :root:not([data-theme="light"]) [data-v="imob"]{--acc:#7CCFAE;--acc-fill:#22805F;--acc-fill-hover:#2A9470;--acc-on:#FFFFFF;--acc-soft:#16291F;--acc-soft-ink:#A6E3C9;--acc-line:#2E5C48}
  :root:not([data-theme="light"]) [data-v="cond"]{--acc:#CFA8EA;--acc-fill:#7E4BA3;--acc-fill-hover:#8F5BB5;--acc-on:#FFFFFF;--acc-soft:#2A1F33;--acc-soft-ink:#E0C6F2;--acc-line:#56406A}
  :root:not([data-theme="light"]) [data-v="saude"]{--acc:#74C9D6;--acc-fill:#0F7C8C;--acc-fill-hover:#138FA1;--acc-on:#FFFFFF;--acc-soft:#132A2E;--acc-soft-ink:#A5DEE6;--acc-line:#2A5A62}
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1215; --surface:#171B1F; --surface-2:#1D2227; --surface-3:#262C32;
  --rail:#13171A; --chat-bg:#12161A; --field-bg:#1D2227;
  --line:#2B3239; --line-strong:#3C454E; --field-line:#6B757F;
  --ink:#EEF1F4; --ink-2:#C3CAD1; --ink-3:#9AA4AE; --ink-faint:#6B757F;
  --ia-bg:#232A31;
  --crit:#E5544D; --crit-ink:#F7B9B4; --crit-bg:#3B1A19; --crit-line:#6E2F2B;
  --warn:#E8A42A; --warn-ink:#F6D190; --warn-bg:#372A10; --warn-line:#6B5218;
  --ok:#4DB872;   --ok-ink:#9FDDB3;   --ok-bg:#15291C;   --ok-line:#2C5A3B;
  --chart-1:#3987e5; --chart-2:#d95926; --chart-3:#199e70;
  --brand:#EEF1F4; --brand-on:#0F1215;
  --phone-body:#2A3036;
  --shadow-float:0 12px 32px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
  --acc:#A3B5F0; --acc-fill:#3A57B8; --acc-fill-hover:#4867C9; --acc-on:#FFFFFF;
  --acc-soft:#1E2640; --acc-soft-ink:#C4D0F7; --acc-line:#3A4A7A;
}
:root[data-theme="dark"] [data-v="edu"]{--acc:#A3B5F0;--acc-fill:#3A57B8;--acc-fill-hover:#4867C9;--acc-on:#FFFFFF;--acc-soft:#1E2640;--acc-soft-ink:#C4D0F7;--acc-line:#3A4A7A}
:root[data-theme="dark"] [data-v="imob"]{--acc:#7CCFAE;--acc-fill:#22805F;--acc-fill-hover:#2A9470;--acc-on:#FFFFFF;--acc-soft:#16291F;--acc-soft-ink:#A6E3C9;--acc-line:#2E5C48}
:root[data-theme="dark"] [data-v="cond"]{--acc:#CFA8EA;--acc-fill:#7E4BA3;--acc-fill-hover:#8F5BB5;--acc-on:#FFFFFF;--acc-soft:#2A1F33;--acc-soft-ink:#E0C6F2;--acc-line:#56406A}
:root[data-theme="dark"] [data-v="saude"]{--acc:#74C9D6;--acc-fill:#0F7C8C;--acc-fill-hover:#138FA1;--acc-on:#FFFFFF;--acc-soft:#132A2E;--acc-soft-ink:#A5DEE6;--acc-line:#2A5A62}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:var(--fs-md);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{margin:0;font-stretch:var(--cond);font-weight:650;letter-spacing:-.005em;line-height:1.2;text-wrap:balance}
h1{font-size:var(--fs-2xl)} h2{font-size:var(--fs-xl)} h3{font-size:var(--fs-lg)}
p{margin:0} ul,ol{margin:0;padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc);text-underline-offset:2px}
img,svg{max-width:100%}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic-sm{width:14px;height:14px}
.ic-lg{width:22px;height:22px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.eyebrow{font-size:var(--fs-xs);font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-stretch:var(--cond);color:var(--ink-3)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
:focus:not(:focus-visible){outline:none}
[tabindex="-1"]:focus{outline:none}
.skip{position:absolute;left:16px;top:-80px;z-index:100;background:var(--acc-fill);color:var(--acc-on);padding:10px 14px;border-radius:var(--r-2);text-decoration:none;font-weight:600}
.skip:focus{top:12px}

/* ---------- botões e campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r-2);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:var(--fs-md);text-decoration:none;white-space:nowrap;transition:background-color .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--field-line)}
.btn-primary{background:var(--acc-fill);border-color:var(--acc-fill);color:var(--acc-on)}
.btn-primary:hover{background:var(--acc-fill-hover);border-color:var(--acc-fill-hover)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-quiet:hover{background:var(--surface-3);border-color:transparent}
.btn-sm{min-height:32px;padding:0 12px;font-size:var(--fs-sm)}
.btn-lg{min-height:48px;padding:0 22px;font-size:var(--fs-lg)}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.field{display:grid;gap:6px;min-width:0}
.label{font-size:var(--fs-sm);font-weight:600;color:var(--ink-2)}
.hint{font-size:var(--fs-sm);color:var(--ink-3)}
.err{font-size:var(--fs-sm);color:var(--crit-ink);font-weight:600;display:flex;gap:6px;align-items:center}
.input,.select select,.textarea{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--field-line);border-radius:var(--r-2);background:var(--field-bg);color:var(--ink);font-size:var(--fs-md)}
.textarea{min-height:96px;resize:vertical;line-height:1.5}
.input::placeholder,.textarea::placeholder{color:var(--ink-3)}
.input:focus,.select select:focus,.textarea:focus{border-color:var(--acc);outline:2px solid var(--focus);outline-offset:0}
.select{position:relative;display:block}
.select select{appearance:none;-webkit-appearance:none;padding-right:36px;cursor:pointer}
.select .ic{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-3)}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search .input{padding-left:38px}

/* ---------- selos, pílulas e marcadores ---------- */
.seal{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 8px;border-radius:var(--r-1);border:1px solid var(--line);font-size:var(--fs-sm);font-weight:600;line-height:1.2;white-space:nowrap;background:var(--surface);color:var(--ink-2)}
.seal .ic{width:14px;height:14px}
.seal-crit{background:var(--crit-bg);color:var(--crit-ink);border-color:var(--crit-line)}
.seal-today{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line)}
.seal-soon{background:var(--surface);color:var(--warn-ink);border-color:var(--warn-line)}
.seal-ok{color:var(--ink-2)}
.seal-ok .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.seal-pause{background:var(--surface-2);border-style:dashed;border-color:var(--field-line);color:var(--ink-2)}
.seal-done{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line)}
.seal-late{background:var(--surface-2);color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 10px 2px 8px;border-radius:999px;font-size:var(--fs-sm);font-weight:600;white-space:nowrap;line-height:1.2;border:1px solid transparent}
.pill .ic{width:14px;height:14px}
.pill-recebido{background:var(--surface-3);color:var(--ink-2)}
.pill-analise{background:var(--acc-soft);color:var(--acc-soft-ink)}
.pill-aguardando{background:var(--surface);color:var(--ink-2);border:1px dashed var(--field-line)}
.pill-concluido{background:var(--ok-bg);color:var(--ok-ink)}
.chan{display:inline-flex;align-items:center;gap:5px;color:var(--ink-3);font-size:var(--fs-sm);white-space:nowrap}
.chan .ic{width:14px;height:14px}
.tag-ia{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:0 4px;border-radius:3px;border:1px solid var(--acc-line);color:var(--acc);line-height:16px}
.tag-new{display:inline-flex;font-size:var(--fs-xs);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--acc-on);background:var(--acc-fill);border-radius:3px;padding:0 5px;line-height:18px;font-stretch:var(--cond)}
.avatar{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);font-size:11px;font-weight:700;letter-spacing:.02em;flex:none;font-stretch:var(--cond)}
.avatar-you{background:var(--acc-soft);color:var(--acc-soft-ink)}
.chip-fict{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line-strong);font-size:var(--fs-xs);font-weight:600;color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.chip-fict .ic{width:14px;height:14px}

/* régua de prazo: dias úteis decorridos sobre o prazo do tipo */
.ruler{position:relative;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;width:100%;--gap-c:var(--surface);--rf:var(--acc)}
.ruler>i{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:var(--rf);border-radius:3px}
.ruler[data-seg]::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(var(--seg) - 2px),var(--gap-c) calc(var(--seg) - 2px) var(--seg))}
.ruler[data-k="crit"]{--rf:var(--crit)}
.ruler[data-k="today"],.ruler[data-k="soon"]{--rf:var(--warn)}
.ruler[data-k="done"]{--rf:var(--ok)}
.ruler[data-k="late"]{--rf:var(--ink-faint)}
.ruler[data-k="pause"]>i{background:repeating-linear-gradient(135deg,var(--ink-faint) 0 3px,transparent 3px 6px)}

/* ---------- casca do aplicativo ---------- */
.app{min-height:100vh;display:grid;grid-template-columns:264px minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"top top" "rail main"}
.top{grid-area:top;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;min-height:var(--top-h);padding:8px 20px 8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:700;font-stretch:var(--cond);font-size:var(--fs-lg);letter-spacing:.01em;flex:none;border-radius:var(--r-2)}
.brand svg{width:28px;height:28px;flex:none}
.top-sep{width:1px;height:28px;background:var(--line);flex:none}
.org{display:flex;align-items:center;gap:10px;min-width:0}
.org-mono{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:var(--r-2);background:var(--acc-fill);color:var(--acc-on);font-weight:700;font-size:12.5px;letter-spacing:.03em;flex:none;font-stretch:var(--cond)}
.org-txt{display:grid;min-width:0;line-height:1.2}
.org-txt strong{font-weight:650;font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org-txt small{font-size:var(--fs-xs);color:var(--ink-3)}
.org-short{display:none}
.top-end{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.top-user{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);color:var(--ink-2)}
.rail{grid-area:rail;position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - var(--top-h));overflow:auto;padding:20px 12px;border-right:1px solid var(--line);background:var(--rail);display:flex;flex-direction:column;gap:22px}
.rail-group{display:grid;gap:2px}
.rail-group .eyebrow{padding:0 10px 6px}
.nav{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:var(--r-2);color:var(--ink-2);text-decoration:none;font-weight:550;font-size:var(--fs-md)}
.nav:hover{background:var(--surface-3);color:var(--ink)}
.nav[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-weight:650}
.nav[aria-current="page"] .ic{color:var(--acc)}
.nav-badge{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:999px;display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--surface-3);color:var(--ink-2);font-variant-numeric:tabular-nums}
.nav-badge.warn{background:var(--warn-bg);color:var(--warn-ink);box-shadow:inset 0 0 0 1px var(--warn-line)}
.rail-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:var(--fs-sm);color:var(--ink-3);display:flex;gap:10px;align-items:center}
.rail-foot strong{color:var(--ink);font-weight:600;display:block}
.main{grid-area:main;min-width:0;padding:28px 32px 56px}
.bnav{display:none}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
.page-h .sub{color:var(--ink-3);margin-top:4px;font-size:var(--fs-md)}
.page-h-actions{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2,.panel-h h3{font-size:var(--fs-lg)}
.panel-b{padding:16px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:600;color:var(--ink-3);text-decoration:none;margin-bottom:10px;border-radius:var(--r-1)}
.back:hover{color:var(--ink)}

/* ---------- tela inicial ---------- */
.start{max-width:1180px;margin:0 auto;padding-block:28px 56px;padding-inline:32px}
.start-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:48px}
.start-hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:48px;align-items:end}
.start-hero h1{font-size:var(--fs-3xl);font-stretch:var(--display);font-weight:700;letter-spacing:-.015em;line-height:1.05;max-width:16ch}
.start-hero .lead{margin-top:16px;font-size:var(--fs-lg);color:var(--ink-2);max-width:56ch}
.facts{display:grid;gap:10px;border-left:1px solid var(--line);padding-left:24px}
.facts li{display:flex;gap:10px;align-items:flex-start;color:var(--ink-2)}
.facts .ic{color:var(--ink-3);margin-top:2px}
.vhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:48px 0 14px}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.vcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;padding:20px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:inherit;transition:border-color .15s}
.vcard:hover{border-color:var(--acc)}
.vcard:hover .vcta{color:var(--acc)}
.vicon{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-3);background:var(--acc-soft);color:var(--acc-soft-ink)}
.vicon .ic{width:24px;height:24px}
.vtitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vtitle .eyebrow{color:var(--acc)}
.vcard h2{font-size:var(--fs-xl);margin-top:4px}
.vwho{margin-top:4px;color:var(--ink-3);font-size:var(--fs-sm)}
.vtypes{margin-top:14px;display:grid;gap:0;border-top:1px solid var(--line)}
.vtypes li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm)}
.vtypes li span:last-child{color:var(--ink-3);white-space:nowrap}
.vcta{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-weight:650;color:var(--ink)}
.vbadge{font-size:var(--fs-xs);font-weight:600;color:var(--ink-2);border:1px solid var(--line-strong);border-radius:999px;padding:1px 8px}
.start-foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-3);font-size:var(--fs-sm);display:flex;gap:8px;align-items:flex-start;max-width:80ch}

/* ---------- fila ---------- */
.attn{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.attn-btn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:var(--r-2);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:600;font-size:var(--fs-sm)}
.attn-btn b{font-size:var(--fs-md);color:var(--ink);font-variant-numeric:tabular-nums}
.attn-btn:hover{border-color:var(--field-line)}
.attn-btn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.attn-crit{background:var(--crit-bg);border-color:var(--crit-line);color:var(--crit-ink)}
.attn-crit b{color:var(--crit-ink)}
.attn-today{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.attn-today b{color:var(--warn-ink)}
.attn-crit[aria-pressed="true"]{border-color:var(--crit-ink);box-shadow:inset 0 0 0 1px var(--crit-ink)}
.attn-today[aria-pressed="true"]{border-color:var(--warn-ink);box-shadow:inset 0 0 0 1px var(--warn-ink)}
.filters{display:grid;grid-template-columns:minmax(220px,1.6fr) repeat(3,minmax(140px,1fr)) auto;gap:10px;align-items:end;margin-bottom:14px}
.ftoggle{display:none}
.ctab-cst{max-width:100%;overflow:hidden;font-size:11px;padding:1px 6px}
.ctab-cst .cl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);overflow:hidden}
.q-head,.q-row{display:grid;grid-template-columns:minmax(190px,1.7fr) minmax(150px,1.3fr) 150px minmax(170px,1.3fr) 180px;gap:16px;align-items:center;padding:12px 16px}
.q-head{background:var(--surface-2);border-bottom:1px solid var(--line);padding-block:9px}
.q-head .eyebrow{letter-spacing:.06em}
.q-row{border-bottom:1px solid var(--line);color:inherit;text-decoration:none;position:relative}
.q-list li:last-child .q-row{border-bottom:0}
.c-sr{display:contents}
.q-row:hover{background:var(--surface-2)}
.q-row:hover .ruler{--gap-c:var(--surface-2)}
.q-row:focus-visible{outline-offset:-2px;border-radius:var(--r-3)}
.q-row[data-k="crit"]{box-shadow:inset 3px 0 0 var(--crit)}
.q-row[data-k="today"]{box-shadow:inset 3px 0 0 var(--warn)}
.q-row[data-k="done"],.q-row[data-k="late"]{color:var(--ink-3)}
.c-type{display:grid;gap:3px;min-width:0}
.c-type strong{font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.c-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--ink-3)}
.c-who{display:grid;min-width:0;line-height:1.35}
.c-who .nm{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-who .inf{font-size:var(--fs-sm);color:var(--ink-3);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.c-state{min-width:0}
.c-resp{display:flex;align-items:center;gap:8px;min-width:0;font-size:var(--fs-sm)}
.c-resp span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-resp.none{color:var(--warn-ink);font-weight:600}
.c-dl{display:grid;gap:6px;justify-items:start;min-width:0}
.dl-sub{font-size:var(--fs-xs);color:var(--ink-3);font-family:var(--font-mono)}
.empty{padding:40px 16px;text-align:left;display:grid;gap:10px;justify-items:start;max-width:52ch}
.empty h3{font-size:var(--fs-lg)}

/* ---------- detalhe ---------- */
.dt-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:start;margin-bottom:20px}
.dt-head h1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dt-meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink-3);font-size:var(--fs-sm);align-items:center}
.dt-dl{display:grid;gap:6px;justify-items:end;text-align:right}
.dt-dl .seal{font-size:var(--fs-md);min-height:30px;padding:3px 10px}
.dt-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.dt-main{display:grid;gap:20px;min-width:0}
.dt-side{display:grid;gap:16px;position:sticky;top:calc(var(--top-h) + 20px)}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) minmax(0,1fr);gap:8px 16px;font-size:var(--fs-sm)}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.quote{font-size:var(--fs-md);line-height:1.6;color:var(--ink);padding:12px 14px;background:var(--surface-2);border-radius:var(--r-2);border:1px solid var(--line);max-width:70ch}
.states{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.state-btn{display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:var(--r-2);background:var(--surface);font-size:var(--fs-sm);font-weight:600;color:var(--ink-2);text-align:left;line-height:1.2}
.state-btn:hover{border-color:var(--field-line)}
.state-btn[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-soft-ink);box-shadow:inset 0 0 0 1px var(--acc)}
.confirm{margin-top:10px;padding:12px;border:1px solid var(--ok-line);background:var(--ok-bg);border-radius:var(--r-2);display:grid;gap:10px;color:var(--ok-ink);font-size:var(--fs-sm)}
.confirm-actions{display:flex;gap:8px;flex-wrap:wrap}
.side-sec{display:grid;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.side-sec:last-child{border-bottom:0}
.side-sec .eyebrow{margin-bottom:2px}
.prazo-big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.prazo-big strong{font-size:var(--fs-xl);font-stretch:var(--cond);font-weight:650}
.note-pause{font-size:var(--fs-sm);color:var(--ink-2);display:flex;gap:8px;align-items:flex-start}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 12px}
.tab{appearance:none;border:0;background:none;padding:12px 10px 10px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:center;font-size:var(--fs-md)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.composer{padding:14px 16px;display:grid;gap:10px}
.templates{display:flex;flex-wrap:wrap;gap:6px}
.tpl{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:var(--fs-sm);color:var(--ink-2);font-weight:550}
.tpl:hover{border-color:var(--acc);color:var(--acc)}
.composer-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.composer.is-note .textarea{background:var(--surface-2);border-style:dashed}
.tl{display:grid;gap:0;padding:8px 16px 16px}
.ev{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;position:relative;padding-top:12px}
.ev::before{content:"";position:absolute;left:13.5px;top:40px;bottom:-12px;width:1px;background:var(--line)}
.ev:last-child::before{display:none}
.ev-ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-3)}
.ev-ic .ic{width:14px;height:14px}
.ev-crit .ev-ic{background:var(--crit-bg);color:var(--crit-ink)}
.ev-warn .ev-ic{background:var(--warn-bg);color:var(--warn-ink)}
.ev-ok .ev-ic{background:var(--ok-bg);color:var(--ok-ink)}
.ev-acc .ev-ic{background:var(--acc-soft);color:var(--acc-soft-ink)}
.ev-top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:var(--fs-sm)}
.ev-top strong{font-weight:600;color:var(--ink)}
.ev-top time{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--ink-3)}
.ev-txt{font-size:var(--fs-sm);color:var(--ink-2);margin-top:2px}
.ev-crit .ev-txt{color:var(--crit-ink)}
.ev-box{margin-top:6px;padding:10px 12px;border-radius:var(--r-3);font-size:var(--fs-md);line-height:1.5;max-width:68ch}
.ev-reply .ev-box{background:var(--acc-soft);color:var(--ink)}
.ev-note .ev-box{background:var(--surface-2);border:1px dashed var(--field-line);color:var(--ink)}
.ev-note .lock{display:inline-flex;gap:4px;align-items:center;font-size:var(--fs-xs);font-weight:600;color:var(--ink-3)}
.ev-in .ev-box{background:var(--surface);border:1px solid var(--line)}

/* ---------- registro rápido ---------- */
.reg-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.reg-form{display:grid;gap:22px;padding:20px}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:var(--r-3);background:var(--surface-3);width:max-content;max-width:100%}
.seg-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:var(--r-2);border:0;background:transparent;color:var(--ink-2);font-weight:600}
.seg-btn[aria-checked="true"],.seg-btn[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-strong)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.type-btn{display:grid;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r-2);background:var(--surface);min-height:58px}
.type-btn b{font-weight:600;font-size:var(--fs-md);color:var(--ink)}
.type-btn span{font-size:var(--fs-sm);color:var(--ink-3)}
.type-btn:hover{border-color:var(--field-line)}
.type-btn[aria-checked="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc)}
.type-btn[aria-checked="true"] span{color:var(--acc-soft-ink)}
.combo{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:15;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-2);box-shadow:var(--shadow-float);padding:4px;max-height:280px;overflow:auto}
.sugg button{display:grid;gap:1px;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:var(--r-1);background:transparent}
.sugg button:hover,.sugg button[aria-selected="true"]{background:var(--acc-soft)}
.sugg b{font-weight:600}
.sugg small{color:var(--ink-3);font-size:var(--fs-sm)}
.picked{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--acc-line);background:var(--acc-soft);border-radius:var(--r-2)}
.picked div{display:grid;min-width:0;line-height:1.35}
.picked small{color:var(--acc-soft-ink);font-size:var(--fs-sm)}
.picked .btn{margin-left:auto}
.timer{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:var(--fs-sm);color:var(--ink-2)}
.timer .mono{font-weight:600;color:var(--ink)}
.timer.run .ic{color:var(--acc)}
.reg-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:4px}
.kbd{font-family:var(--font-mono);font-size:var(--fs-xs);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-2);background:var(--surface-2)}
.preview{display:grid;gap:14px;padding:16px}
.preview .proto{font-family:var(--font-mono);font-size:var(--fs-xl);font-weight:600;letter-spacing:.02em}
.preview .msg-prev{font-size:var(--fs-sm);line-height:1.5;padding:10px 12px;border-radius:var(--r-4);border-bottom-right-radius:4px;background:var(--ia-bg);color:var(--ink)}
.success{display:grid;gap:16px;padding:24px;justify-items:start}
.success .big{font-family:var(--font-mono);font-size:2.25rem;font-weight:600;letter-spacing:.02em;line-height:1.1}
.success-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok-ink)}

/* ---------- atendimento automático ---------- */
.sim-note{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--ink-3);border:1px dashed var(--field-line);border-radius:999px;padding:3px 10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-3);background:var(--surface);margin-bottom:16px}
.stat{padding:14px 16px;border-right:1px solid var(--line);display:grid;gap:2px}
.stat:last-child{border-right:0}
.stat b{font-size:var(--fs-2xl);font-stretch:var(--cond);font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:var(--fs-sm);color:var(--ink-3)}
.sim-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ctabs{display:none}
.chats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.chat{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);min-width:0;overflow:hidden}
.chat-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.chat-h .who{display:grid;min-width:0;line-height:1.25;flex:1 1 150px}
.chat-h .who b{font-weight:650;font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-h .who small{font-size:var(--fs-xs);color:var(--ink-3)}
.cstatus{margin-left:auto;flex:none}
.chat-log{height:430px;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:var(--chat-bg);scroll-behavior:smooth}
.msg{max-width:88%;padding:8px 11px;border-radius:var(--r-4);font-size:var(--fs-sm);line-height:1.45;overflow-wrap:anywhere}
.msg-by{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;color:var(--ink-3);margin-bottom:2px}
.msg.in{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ia{align-self:flex-end;background:var(--ia-bg);border-bottom-right-radius:4px}
.msg.hum{align-self:flex-end;background:var(--acc-soft);border-bottom-right-radius:4px}
.msg.hum .msg-by{color:var(--acc-soft-ink)}
.msg time{display:block;text-align:right;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);margin-top:2px}
.msg .att{display:inline-flex;gap:6px;align-items:center;margin-top:6px;padding:4px 8px;border:1px solid var(--line);border-radius:var(--r-2);font-size:var(--fs-xs);background:var(--surface-2)}
.sysl{align-self:center;max-width:94%;text-align:center;font-size:var(--fs-xs);font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-2);padding:5px 10px;display:inline-flex;gap:6px;align-items:center;line-height:1.35}
.sysl .ic{width:14px;height:14px;flex:none}
.sysl.handoff{color:var(--warn-ink);background:var(--warn-bg);border-color:var(--warn-line)}
.sysl.open,.sysl.resolved{color:var(--ok-ink);background:var(--ok-bg);border-color:var(--ok-line)}
.sysl.take{color:var(--acc-soft-ink);background:var(--acc-soft);border-color:var(--acc-line)}
.typing{align-self:flex-end;font-size:var(--fs-xs);color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:var(--ia-bg);border-radius:var(--r-4);border-bottom-right-radius:4px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);display:inline-block;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.msg-enter{animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.chat-f{padding:10px 12px;border-top:1px solid var(--line);display:grid;gap:8px;background:var(--surface);min-height:58px;align-content:center}
.chat-f .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chat-f .textarea{min-height:108px;font-size:var(--fs-sm)}
.chat-f small{font-size:var(--fs-xs);color:var(--ink-3)}
.cst{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:650;white-space:nowrap}
.cst .ic{width:12px;height:12px}
.cst-ia{background:var(--ia-bg);color:var(--ink-2)}
.cst-new{background:var(--surface-3);color:var(--ink-2)}
.cst-wait{background:var(--warn-bg);color:var(--warn-ink);box-shadow:inset 0 0 0 1px var(--warn-line)}
.cst-hum{background:var(--acc-soft);color:var(--acc-soft-ink)}
.cst-ok{background:var(--ok-bg);color:var(--ok-ink)}
.pulse{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.others{margin-top:16px}
.olist li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.olist li:last-child{border-bottom:0}
.olist .t{display:grid;min-width:0;line-height:1.3}
.olist .t b{font-weight:600;font-size:var(--fs-sm)}
.olist .t span{font-size:var(--fs-sm);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- acompanhamento (celular) ---------- */
.track{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;align-items:start}
.track-intro{display:grid;gap:14px;max-width:52ch;padding-top:8px}
.track-intro h1{font-size:var(--fs-2xl)}
.track-intro p{color:var(--ink-2)}
.examples{display:grid;gap:6px;margin-top:6px}
.ex-btn{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-2);text-align:left;font-size:var(--fs-sm)}
.ex-btn:hover{border-color:var(--field-line)}
.ex-btn[aria-current="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.ex-btn .mono{font-weight:600}
.phone{width:390px;max-width:100%;padding:12px;border-radius:44px;background:var(--phone-body);box-shadow:var(--shadow-float)}
.phone-screen{height:760px;overflow-y:auto;border-radius:34px;background:var(--bg);display:flex;flex-direction:column}
.ph-top{background:var(--acc-fill);color:var(--acc-on);padding:22px 18px 16px;display:flex;gap:10px;align-items:center}
.ph-top .org-mono{background:rgba(255,255,255,.16);color:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.ph-top div{display:grid;line-height:1.25;min-width:0}
.ph-top b{font-size:var(--fs-md);font-weight:650}
.ph-top small{font-size:var(--fs-xs);opacity:.92}
.ph-body{padding:16px;display:grid;gap:14px;flex:1;align-content:start}
.ph-body h2{font-size:var(--fs-xl)}
.ph-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.ph-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.ph-card h3{font-size:var(--fs-xl)}
.ph-prazo{border-radius:10px;padding:12px;display:grid;gap:6px;background:var(--surface-2);border:1px solid var(--line)}
.ph-prazo strong{font-size:var(--fs-lg);font-weight:650;display:flex;gap:8px;align-items:flex-start}
.ph-prazo strong .ic{margin-top:3px}
.ph-prazo.crit{background:var(--crit-bg);border-color:var(--crit-line);color:var(--crit-ink)}
.ph-prazo.today{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.ph-prazo.pause{background:var(--surface-2);border-style:dashed;border-color:var(--field-line)}
.ph-prazo.done{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
.ph-prazo span{font-size:var(--fs-sm)}
.ph-call{padding:12px;border-radius:10px;background:var(--acc-soft);color:var(--ink);border:1px solid var(--acc-line);font-size:var(--fs-sm);display:grid;gap:4px}
.ph-call b{color:var(--acc-soft-ink)}
.steps{display:grid;gap:0}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;position:relative;padding-bottom:14px}
.step::before{content:"";position:absolute;left:12.5px;top:26px;bottom:0;width:1px;background:var(--line-strong)}
.step:last-child{padding-bottom:0} .step:last-child::before{display:none}
.step.done::before{background:var(--ok)}
.dotx{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink-3)}
.dotx .ic{width:14px;height:14px}
.step.done .dotx{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step.now .dotx{border:2px solid var(--acc);background:var(--acc-soft);color:var(--acc-soft-ink)}
.step.skip .dotx{border-style:dashed}
.step b{font-weight:650;font-size:var(--fs-md);display:block}
.step.future b,.step.skip b{color:var(--ink-3);font-weight:600}
.step span{font-size:var(--fs-sm);color:var(--ink-3)}
.step.now span{color:var(--ink-2)}
.ph-msgs{display:grid;gap:8px}
.ph-msg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-4);border-top-left-radius:4px;padding:10px 12px;font-size:var(--fs-sm);line-height:1.5}
.ph-msg small{display:flex;justify-content:space-between;gap:8px;color:var(--ink-3);font-size:var(--fs-xs);margin-bottom:4px;font-weight:600}
.ph-foot{padding:14px 16px 22px;font-size:var(--fs-xs);color:var(--ink-3);display:flex;gap:6px;align-items:center;justify-content:center;border-top:1px solid var(--line)}
.notfound{padding:12px;border-radius:10px;border:1px solid var(--crit-line);background:var(--crit-bg);color:var(--crit-ink);font-size:var(--fs-sm)}

/* ---------- painel do supervisor ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);padding:16px;display:grid;gap:4px;align-content:start}
.kpi-l{display:flex;gap:6px;align-items:flex-start;font-size:var(--fs-sm);font-weight:600;color:var(--ink-2);line-height:1.3}
.kpi-l .ic{margin-top:1px;color:var(--ink-3)}
.kpi-v{font-size:2rem;font-stretch:var(--cond);font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi-s{font-size:var(--fs-sm);color:var(--ink-3)}
.kpi.crit{background:var(--crit-bg);border-color:var(--crit-line)}
.kpi.crit .kpi-v,.kpi.crit .kpi-l,.kpi.crit .kpi-l .ic{color:var(--crit-ink)}
.kpi.crit .kpi-s{color:var(--crit-ink)}
.sup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.hbars{display:grid;gap:14px;padding:18px 16px}
.hbar{display:grid;grid-template-columns:128px minmax(0,1fr) 44px;gap:12px;align-items:center}
.hbar .lb{font-size:var(--fs-sm);color:var(--ink-2);display:flex;gap:6px;align-items:center}
.hbar .lb .ic{color:var(--ink-3)}
.hbar .val{font-size:var(--fs-sm);font-weight:650;text-align:right;font-variant-numeric:tabular-nums}
.track-bar{height:18px;position:relative;border-bottom:1px solid var(--line)}
.track-bar>i{position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--acc);border-radius:0 4px 4px 0}
.chart-note{padding:0 16px 16px;font-size:var(--fs-sm);color:var(--ink-3)}
.stack{padding:18px 16px 8px;display:grid;gap:14px}
.stack-bar{display:flex;gap:2px;height:28px}
.stack-bar>span{display:block;height:100%;min-width:4px}
.stack-bar>span:first-child{border-radius:4px 0 0 4px}
.stack-bar>span:last-child{border-radius:0 4px 4px 0}
.stack-bar>span:hover,.stack-bar>span:focus-visible{filter:brightness(1.08)}
.legend{display:grid;gap:8px}
.legend li{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:var(--fs-sm)}
.legend .sw{width:12px;height:12px;border-radius:3px}
.legend .v{font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.legend .p{color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:var(--fs-sm);padding:6px 10px;border-radius:var(--r-2);box-shadow:var(--shadow-float);max-width:240px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sm);min-width:640px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:9px 14px;border-bottom:1px solid var(--line);font-stretch:var(--cond);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl .who{display:flex;gap:8px;align-items:center}
.tbl .crit-n{color:var(--crit-ink);font-weight:700}
.tbl .warn-n{color:var(--warn-ink);font-weight:700}
.tbl .zero{color:var(--ink-faint)}
.alist li a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;align-items:center}
.alist li:last-child a{border-bottom:0}
.alist li a:hover{background:var(--surface-2)}
.alist .t{display:grid;min-width:0}
.alist .t b{font-weight:600;font-size:var(--fs-md)}
.alist .t span{font-size:var(--fs-sm);color:var(--ink-3)}

/* ---------- aviso flutuante ---------- */
.toast{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;max-width:min(440px,calc(100vw - 32px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:var(--r-3);box-shadow:var(--shadow-float);display:flex;gap:10px;align-items:flex-start;font-size:var(--fs-sm);line-height:1.45}
.toast[hidden]{display:none}
.toast .ic{flex:none;margin-top:1px}

/* ---------- responsivo ---------- */
@media (max-width:1279px){
  .q-head{display:none}
  .q-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"type seal" "meta date" "who who" "sr sr" "ruler ruler";gap:6px 12px;padding:14px 16px}
  .c-type,.c-dl{display:contents}
  .c-type strong{grid-area:type}
  .c-meta{grid-area:meta}
  .c-who{grid-area:who;margin-top:4px}
  .c-sr{grid-area:sr;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-top:2px;min-width:0}
  .c-dl .seal{grid-area:seal;justify-self:end}
  .c-dl .dl-sub{grid-area:date;justify-self:end;align-self:center}
  .c-dl .ruler{grid-area:ruler;margin-top:6px}
  .q-list{display:grid}
  .filters{grid-template-columns:repeat(3,minmax(0,1fr))}
  .filters .f-search{grid-column:1/-1}
  .filters .clear{grid-column:1/-1;justify-self:start}
}
@media (max-width:1180px){
  .dt-grid,.reg-grid{grid-template-columns:minmax(0,1fr)}
  .dt-side{position:static;order:-1}
  .chats{grid-template-columns:minmax(0,1fr)}
  .ctabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--surface-3);border-radius:var(--r-3);margin-bottom:10px}
  .ctab{display:grid;gap:3px;justify-items:start;padding:8px;border:0;border-radius:var(--r-2);background:transparent;text-align:left;min-width:0}
  .ctab b{font-size:var(--fs-sm);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .ctab[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--line-strong)}
  .chat[data-hide="true"]{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sup-grid{grid-template-columns:minmax(0,1fr)}
  .track{grid-template-columns:minmax(0,1fr) auto;gap:28px}
  .top-user{display:none}
}
@media (max-width:959px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main"}
  .rail{display:none}
  .main{padding:18px 16px calc(92px + env(safe-area-inset-bottom,0px))}
  .top{padding:8px 16px;gap:10px}
  .top-sep,.top-user,.org-txt small,.top .brand-name{display:none}
  .org-full{display:none} .org-short{display:inline}
  .top-end{gap:8px}
  .swap-txt{display:none}
  .swap{min-height:36px;padding:0 10px}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav a{display:grid;justify-items:center;gap:3px;padding:8px 2px 9px;color:var(--ink-3);text-decoration:none;font-size:11px;font-weight:600;position:relative;min-width:0}
  .bnav a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bnav a .ic{width:22px;height:22px}
  .bnav a[aria-current="page"]{color:var(--acc);background:transparent;box-shadow:none}
  .bnav a:hover{background:transparent}
  .bnav a[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--acc);border-radius:0 0 2px 2px}
  .bnav .nav-badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:16px;font-size:10px;padding:0 4px}
  h1{font-size:var(--fs-xl)}
  .page-h{margin-bottom:16px}
  .page-h-actions{width:100%}
  .page-h-actions .btn{flex:1}
  .ftoggle{display:inline-flex;margin-bottom:12px}
  .filters:not(.open){display:none}
  .start{padding-inline:16px;padding-block:18px 40px}
  .start-top{margin-bottom:28px}
  .start-hero{grid-template-columns:minmax(0,1fr);gap:24px}
  .start-hero h1{font-size:2rem}
  .facts{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}
  .vgrid{grid-template-columns:minmax(0,1fr)}
  .vcard{grid-template-columns:minmax(0,1fr);padding:16px}
  .dt-head{grid-template-columns:minmax(0,1fr)}
  .dt-dl{justify-items:start;text-align:left}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .stat b{font-size:var(--fs-xl)}
  .chat-log{height:400px}
  .track{grid-template-columns:minmax(0,1fr);gap:20px}
  .track-intro{order:2}
  .phone{width:auto;padding:0;background:none;box-shadow:none;border-radius:0}
  .phone-screen{height:auto;overflow:hidden;border-radius:12px;border:1px solid var(--line)}
  .ph-top{padding:16px}
  .kpi-v{font-size:1.625rem}
  .hbar{grid-template-columns:minmax(0,1fr) 40px;grid-template-areas:"lb val" "bar bar";gap:6px 12px}
  .hbar .lb{grid-area:lb} .hbar .val{grid-area:val} .hbar .track-bar{grid-area:bar}
  .toast{left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .types{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg{width:100%}
  .reg-form{padding:16px}
  .success .big{font-size:1.75rem}
}
@media (max-width:420px){
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters .f-canal{grid-column:1/-1}
  .types{grid-template-columns:minmax(0,1fr)}
  .states{grid-template-columns:minmax(0,1fr)}
  .chip-fict{padding:0 8px}
  .top .chip-fict .ic{display:none}
  .top{gap:8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .typing i,.pulse{animation:none!important;opacity:1}
}

/* ==========================================================================
   Acréscimos da demo funcional (DEV-UI). Só componentes novos, com os
   mesmos tokens; nada acima foi mudado.
   ========================================================================== */
/* carregando */
.loading{min-height:50vh;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--ink-3);font-size:var(--fs-md)}
.loading .spin{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--acc);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* estados do detalhe: o motor só permite as transições válidas */
.state-btn[disabled]{opacity:.5;cursor:not-allowed}
.state-btn[disabled]:hover{border-color:var(--line-strong)}
.state-btn[aria-pressed="true"][disabled]{opacity:1;cursor:default}
.states-hint{font-size:var(--fs-sm);color:var(--ink-3)}
/* aviso discreto do modo de gravação e "Restaurar demonstração" */
.demo-note{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:40px;padding-top:12px;border-top:1px solid var(--line);font-size:var(--fs-sm);color:var(--ink-3)}
.demo-note>span{display:inline-flex;gap:6px;align-items:flex-start}
.demo-note>span .ic{margin-top:2px}
.demo-note .btn-quiet{color:var(--ink-3)}
.demo-note .btn-quiet:hover{color:var(--ink)}
.demo-note .confirm{flex-basis:100%;margin-top:4px;max-width:640px}
.confirm-warn{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.start .demo-note{margin-top:20px;max-width:80ch}
/* tela inicial: "Sobre a demonstração" no lugar do rodapé */
.about{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:10px;max-width:80ch}
.about ul{display:grid;gap:8px}
.about li{display:flex;gap:8px;align-items:flex-start;color:var(--ink-3);font-size:var(--fs-sm)}
.about li .ic{margin-top:2px}
/* aviso de erro (a gravação falhou: nunca sucesso falso) */
.toast-err .ic{color:var(--crit-line)}
/* tabela larga: "Aguardando o inquilino" não cabe nos 150 px da coluna Estado
   (acontecia também no protótipo); a pílula quebra dentro da coluna */
@media (min-width:1280px){
  .q-row .c-state .pill{white-space:normal;max-width:100%;padding-block:3px}
}
.start .demo-note{border-top:0;padding-top:0}
</style>
