    </div>
    <section class="panel"><div class="panel-h"><h2>Pedidos por responsável</h2><span class="hint">Em aberto agora · concluídos e tempo médio de todos os pedidos da fila</span></div>
      <div class="tbl-wrap" tabindex="0" role="region" aria-label="Tabela de pedidos por responsável"><table class="tbl"><thead><tr><th scope="col">Responsável</th><th scope="col" class="r">Em aberto</th><th scope="col" class="r">Vencidos</th><th scope="col" class="r">Vencem hoje</th><th scope="col" class="r">Aguardando</th><th scope="col" class="r">Concluídos</th><th scope="col" class="r">1ª resposta (média)</th></tr></thead>
      <tbody>${members.map(x => `<tr><td><span class="who"><span class="avatar${x.n === v.user.n ? ' avatar-you' : ''}" aria-hidden="true">${ini(x.n)}</span>${esc(x.n)}</span></td>${cell(x.open)}${cell(x.crit, 'crit-n')}${cell(x.today, 'warn-n')}${cell(x.wait)}${cell(x.c)}<td class="r${x.t === '—' ? ' zero' : ''}">${esc(x.t)}</td></tr>`).join('')}
      ${none.abertos ? `<tr><td><span class="who"><span class="avatar" aria-hidden="true">${ic('alerta', 'ic-sm')}</span>Sem responsável</span></td>${cell(none.abertos, 'warn-n')}${cell(none.vencidos, 'crit-n')}${cell(none.venceHoje, 'warn-n')}${cell(none.aguardando)}${cell(none.concluidos)}<td class="r zero">—</td></tr>` : ''}</tbody></table></div></section>`;
  }

  /* ---------------------------------------------------------- avisos, dicas e cópia */
  let toastT = null;
  function toast(msg, kind) {
    const t = document.getElementById('toast');
    t.className = 'toast' + (kind === 'err' ? ' toast-err' : '');
    t.innerHTML = ic(kind === 'ok' ? 'check' : kind === 'err' ? 'alerta' : 'info') + '<span>' + esc(msg) + '</span>';
    t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, kind === 'err' ? 7000 : 4500);
  }
  function announce(msg) { let el = document.getElementById('sr-live'); if (!el) { el = document.createElement('div'); el.id = 'sr-live'; el.className = 'sr-only'; el.setAttribute('aria-live', 'polite'); document.body.appendChild(el); } el.textContent = ''; setTimeout(() => { el.textContent = msg; }, 60); }
  const tip = document.getElementById('tip');
  function showTip(el, x, y) { tip.textContent = el.getAttribute('data-tip'); tip.hidden = false; const w = tip.offsetWidth, h = tip.offsetHeight; let L = x + 12, Tp = y - h - 12; if (L + w > window.innerWidth - 8) L = window.innerWidth - w - 8; if (Tp < 8) Tp = y + 16; tip.style.left = L + 'px'; tip.style.top = Tp + 'px'; }
  document.addEventListener('mousemove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else if (!tip.hidden) tip.hidden = true; });
  document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) { const b = el.getBoundingClientRect(); showTip(el, b.left + b.width / 2, b.top); } });
  document.addEventListener('focusout', () => { tip.hidden = true; });
  function copyText(text, elSel) {
    const fallback = () => { const el = $(elSel); if (el) { const rg = document.createRange(); rg.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(rg); } toast('Não deu para copiar automaticamente. O número está selecionado: use Ctrl + C.'); };
    try { navigator.clipboard.writeText(text).then(() => toast('Protocolo ' + text + ' copiado.', 'ok'), fallback); } catch (err) { fallback(); }
  }

  /* ---------------------------------------------------------- eventos */
  document.addEventListener('click', e => {
    const sk = e.target.closest('.skip');
    if (sk) { e.preventDefault(); const m = document.getElementById('conteudo'); if (m) m.focus(); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    const R = S.route, v = R.v ? V[R.v] : null, act = a.dataset.act;
    if (act === 'restore') { S.restore = !S.restore; refreshDemoNote(); const b = $(S.restore ? '#rs-yes' : '#rs-open'); if (b) b.focus(); return; }
    if (act === 'restore-no') { S.restore = false; refreshDemoNote(); const b = $('#rs-open'); if (b) b.focus(); return; }
    if (act === 'restore-yes') { if (!S.restoring) restaurarTudo(); return; }
    if (!v || !S.ready[v.key]) return;
    if (act === 'attn') {
      const f = F(v), k = a.dataset.f;
      if (k === 'crit' || k === 'today') { const on = f.prazo === k; f.prazo = on ? 'todos' : k; f.estado = 'abertos'; f.flag = null; }
      else if (k === 'semresp') { f.flag = f.flag === 'semresp' ? null : 'semresp'; f.prazo = 'todos'; f.estado = 'abertos'; }
      else if (k === 'wait') { f.estado = f.estado === 'aguardando' ? 'abertos' : 'aguardando'; f.prazo = 'todos'; f.flag = null; }
      refreshQueue(v); const b = $(`[data-act="attn"][data-f="${k}"]`); if (b) b.focus(); return;
    }
    if (act === 'ftoggle') { S.fopen = !S.fopen; const fl = $('#filters'); if (fl) fl.classList.toggle('open', S.fopen); a.setAttribute('aria-expanded', String(S.fopen)); if (S.fopen) { const s = $('#f-busca'); if (s) s.focus(); } return; }
    if (act === 'clear') { S.filters[v.key] = null; F(v); render(); const s = $('#f-busca'); if (s) s.focus(); return; }
    if (R.r === 'pedido') {
      const r = findReq(v, R.p); if (!r) return;
      const C = S.comp[r.protocolo];
      if (act === 'state') {
        const st = a.dataset.st;
        if (st === r.estado) return;
        if (st === 'concluido') { S.confirm = r.protocolo; render(); const y = $('#cf-yes'); if (y) y.focus(); return; }
        S.confirm = null; acao(() => setState(v, r, st)); return;
      }
      if (act === 'confirm-yes') { S.confirm = null; acao(() => setState(v, r, 'concluido', 'st-concluido')); return; }
      if (act === 'confirm-no') { S.confirm = null; render(); const b = $('#st-concluido'); if (b) b.focus(); return; }
      if (act === 'comp-tab') { C.tab = a.dataset.t; C.err = ''; render(); const t = $('#tab-' + C.tab); if (t) t.focus(); return; }
      if (act === 'tpl') { C.text = tplList(v, r)[+a.dataset.i][1]; C.err = ''; const ta = $('#comp-text'); if (ta) { ta.value = C.text; ta.focus(); } return; }
      if (act === 'comp-send') {
        const ta = $('#comp-text'); C.text = ta ? ta.value : C.text;
        acao(async () => {
          let t;
          try { t = C.tab === 'reply' ? M.registrarResposta(r, C.text, v.user.n, agora()) : M.registrarNota(r, C.text, v.user.n, agora()); }
          catch (err) { C.err = err.texto; render(); const t2 = $('#comp-text'); if (t2) t2.focus(); return; }
          const ok = await salvarPedido(v, t.pedido);
          if (ok) { C.text = ''; C.err = ''; toast(C.tab === 'reply' ? 'Resposta registrada no histórico e no acompanhamento do protocolo. Na demonstração, nenhuma mensagem sai daqui.' : 'Nota interna salva. Só a equipe vê.', 'ok'); }
          render(); const b = $('#comp-send'); if (b) b.focus();
        });
        return;
      }
    }
    if (R.r === 'registrar') {
      const RG = R_(v);
      if (act === 'reg-ch') { regTouch(v); RG.ch = a.dataset.ch; render(); const b = $('#ch-' + RG.ch); if (b) b.focus(); return; }
      if (act === 'reg-pick') {
        regTouch(v); const x = suggestions(v)[+a.dataset.i]; if (!x) return;
        if (x.novo) { const fn = x.name.split(' ')[0]; RG.who = { nome: x.name.replace(/\s+/g, ' ').replace(/(^|\s)\S/g, m => m.toUpperCase()), genero: /a$/i.test(fn) ? 'f' : 'm', papel: v.gen.papel, info: 'Novo cadastro', id: 'Sem identificação' }; }
        else RG.who = x.w;
        RG.err.who = null; RG.q = ''; RG.hi = 0; render(); const t = $('.type-btn[aria-checked="true"]') || $('.type-btn'); if (t) t.focus(); return;
      }
      if (act === 'reg-unpick') { RG.who = null; render(); const q = $('#reg-q'); if (q) q.focus(); return; }
      if (act === 'reg-type') { regTouch(v); RG.type = a.dataset.t; RG.err.type = null; render(); const b = $('#ty-' + RG.type); if (b) b.focus(); return; }
      if (act === 'reg-new') { S.reg[v.key] = null; render(); const q = $('#reg-q'); if (q) q.focus(); return; }
    }
    if (act === 'copy') { copyText(a.dataset.txt, '#proto-big'); return; }
    if (R.r === 'ia') {
      const s = simOf(v);
      if (act === 'sim-play') { simStart(v); changedBar(v); const m = $('#sim-main'); if (m) m.focus(); return; }
      if (act === 'sim-pause') { K.iaSimulada.pausarSimulacao(v.vid); s.paused = true; changedBar(v); const m = $('#sim-main'); if (m) m.focus(); return; }
      if (act === 'sim-reset') { simReset(v); render(); refreshBadges(v); const m = $('#sim-main'); if (m) m.focus(); return; }
      if (act === 'ctab') { S.ctab[v.key] = +a.dataset.c; document.querySelectorAll('.ctab').forEach((b, i) => b.setAttribute('aria-pressed', String(i === +a.dataset.c))); document.querySelectorAll('.chat').forEach((c, i) => c.setAttribute('data-hide', String(i !== +a.dataset.c))); afterIA(v); return; }
      const ci = +a.dataset.c, c = s.convs[ci];
      if (!c || c.previa) return;
      if (act === 'take' && c.aguardando === 'assumir') {
        if (s.paused) { K.iaSimulada.continuarSimulacao(v.vid); s.paused = false; changedBar(v); }
        K.iaSimulada.assumir(c.id, v.user.n);
        setTimeout(() => { const dd = $('#draft-' + ci) || $('#cf-' + ci + ' button'); if (dd) dd.focus(); }, 260);
        return;
      }
      if (act === 'send' && c.aguardando === 'enviar') {
        const d = $('#draft-' + ci); const t = d && d.value.trim() ? d.value.trim() : c.rascunho;
        if (s.paused) { K.iaSimulada.continuarSimulacao(v.vid); s.paused = false; changedBar(v); }
        K.iaSimulada.responder(c.id, t, v.user.n);
        const f = $('#cf-' + ci + ' button') || $('#log-' + ci); if (f) f.focus();
        return;
      }
      if (act === 'giveback') { K.iaSimulada.devolver(c.id); return; }
    }
    if (R.r === 'acompanhar' && act === 'trk-ex') { go(`#${v.key}.acompanhar.${a.dataset.p}`); return; }
  });
  document.addEventListener('submit', e => {
    const R = S.route; if (!R.v) return; const v = V[R.v];
    if (e.target.id === 'reg-form') { e.preventDefault(); regSubmit(v); }
    if (e.target.id === 'trk-form') { e.preventDefault(); const q = normalizarProtocolo($('#trk-q').value || ''); if (q) go(`#${v.key}.acompanhar.${q}`); }
  });
  document.addEventListener('input', e => {
    const R = S.route; if (!R.v) return; const v = V[R.v], id = e.target.id;
    if (id === 'f-busca') { F(v).q = e.target.value; const l = $('#qlist'); if (l) l.innerHTML = qListHTML(v); const ft = $('#ftoggle-t'); if (ft) ft.textContent = ftoggleText(v); return; }
    if (id === 'comp-text') { const C = S.comp[R.p]; if (C) C.text = e.target.value; return; }
    if (id === 'reg-q') { regTouch(v); const RG = R_(v); RG.q = e.target.value; RG.hi = 0; const box = $('#reg-sugg'); if (box) box.innerHTML = suggHTML(v); e.target.setAttribute('aria-expanded', String(suggestions(v).length > 0)); return; }
    if (id === 'reg-note') { regTouch(v); R_(v).note = e.target.value; return; }
  });
  document.addEventListener('change', e => {
    const R = S.route; if (!R.v) return; const v = V[R.v], id = e.target.id;
    if (id === 'f-estado' || id === 'f-prazo' || id === 'f-canal') { const f = F(v); f[id.slice(2)] = e.target.value; if (id === 'f-estado') f.flag = null; refreshQueue(v); return; }
    if (id === 'd-resp') {
      const r = findReq(v, R.p); if (!r) return;
      const nw = e.target.value || null; if ((r.responsavel || null) === nw) return;
      acao(async () => {
        const t = M.atribuirResponsavel(r, nw, v.user.n, agora());
        const ok = await salvarPedido(v, t.pedido);
        if (ok) toast(nw ? `Responsável: ${nw}.` : 'Pedido sem responsável.', 'ok');
        render(); const s = $('#d-resp'); if (s) s.focus();
      });
      return;
    }
    if (id === 'reg-resp') { regTouch(v); R_(v).resp = e.target.value; }
  });
  document.addEventListener('keydown', e => {
    const R = S.route; if (!R.v) return; const v = V[R.v];
    if (R.r === 'registrar' && (e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); regSubmit(v); return; }
    if (e.target.id === 'reg-q') {
      const L = suggestions(v), RG = R_(v);
      if (!L.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); RG.hi = (RG.hi + (e.key === 'ArrowDown' ? 1 : L.length - 1)) % L.length; const box = $('#reg-sugg'); if (box) box.innerHTML = suggHTML(v); e.target.setAttribute('aria-activedescendant', 'sg-' + RG.hi); }
      else if (e.key === 'Enter') { e.preventDefault(); const b = $('#sg-' + RG.hi); if (b) b.click(); }
      else if (e.key === 'Escape') { RG.q = ''; e.target.value = ''; const box = $('#reg-sugg'); if (box) box.innerHTML = ''; }
    }
  });

  /* ---------------------------------------------------------- partida */
  const pronto = K.store.iniciar().then(() => {
    K.store.aoMudarModo(() => { const n = $('#modo-txt'); if (n) n.innerHTML = ic('info', 'ic-sm') + esc(modoTexto()); });
    const R = parse();
    return R.v ? carregar(V[R.v]) : null;
  }).catch(() => null).then(() => true);
  render();
  K.ui = {
    pronto: pronto,
    definirRitmo: ms => { if (typeof ms === 'number' && ms >= 0) S.ritmo = ms; }
  };
})();
</script>
</body>
