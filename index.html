  function iso(x) { return exigirData(x).toISOString(); }

  function clonar(obj) { return obj == null ? obj : JSON.parse(JSON.stringify(obj)); }

  function inicioDoDia(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  function mesmoDia(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  // Diferença em dias de calendário (b - a), ignorando a hora.
  function diferencaDias(a, b) {
    var ua = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
    var ub = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((ub - ua) / 86400000);
  }

  function somarDias(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

  // ------------------------------------------------------------ calendário
  var NACIONAIS_FIXOS = [
    { mes: 1, dia: 1, nome: "Confraternização Universal" },
    { mes: 4, dia: 21, nome: "Tiradentes" },
    { mes: 5, dia: 1, nome: "Dia do Trabalho" },
    { mes: 9, dia: 7, nome: "Independência do Brasil" },
    { mes: 10, dia: 12, nome: "Nossa Senhora Aparecida" },
    { mes: 11, dia: 2, nome: "Finados" },
    { mes: 11, dia: 15, nome: "Proclamação da República" },
    { mes: 11, dia: 20, nome: "Dia Nacional de Zumbi e da Consciência Negra" }, // Lei 14.759/2023
    { mes: 12, dia: 25, nome: "Natal" }
  ];
  var MUNICIPAIS = {
    Curitiba: [{ mes: 9, dia: 8, nome: "Nossa Senhora da Luz dos Pinhais" }]
  };
  var CALENDARIO_PADRAO = { municipio: "Curitiba", pontos_facultativos: true, expediente: { inicio: "08:00", fim: "18:00" } };
  var cacheFeriados = {};

  function doisDigitosCal(n) { return (n < 10 ? "0" : "") + n; }
  function chaveDia(d) { return d.getFullYear() + "-" + doisDigitosCal(d.getMonth() + 1) + "-" + doisDigitosCal(d.getDate()); }

  // Domingo de Páscoa (algoritmo de Meeus/Jones/Butcher, calendário gregoriano).
  function pascoa(ano) {
    var a = ano % 19, b = Math.floor(ano / 100), c = ano % 100;
    var d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    var h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
    var l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    var x = h + l - 7 * m + 114;
    return new Date(ano, Math.floor(x / 31) - 1, (x % 31) + 1);
  }

  function minutosDoDia(hhmm, padrao) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || "");
    return m && +m[1] < 24 && +m[2] < 60 ? (+m[1]) * 60 + (+m[2]) : padrao;
  }

  /*
   * Calendário normalizado: { municipio, pontos_facultativos, inicioMin, fimMin, chave }.
   *   arg: id da vertical (usa `calendario` de verticais.js), objeto
   *   { municipio?, pontos_facultativos?, expediente?: { inicio: "HH:MM", fim: "HH:MM" } }
   *   ou nada (padrão). Um objeto já normalizado passa direto (é o caso dentro
   *   dos laços). Expediente inválido (fim antes do início) volta ao padrão.
   */
  function calendarioDe(arg) {
    if (arg && typeof arg === "object" && typeof arg.chave === "string") return arg;
    var base = CALENDARIO_PADRAO;
    if (typeof arg === "string" && K.verticais && K.verticais[arg] && K.verticais[arg].calendario) base = K.verticais[arg].calendario;
    else if (arg && typeof arg === "object") base = arg;
    var municipio = base.municipio === undefined ? CALENDARIO_PADRAO.municipio : (base.municipio || null);
    var pf = base.pontos_facultativos === undefined ? CALENDARIO_PADRAO.pontos_facultativos : !!base.pontos_facultativos;
    var exp = base.expediente || CALENDARIO_PADRAO.expediente;
    var ini = minutosDoDia(exp.inicio, 480), fim = minutosDoDia(exp.fim, 1080);
    if (!(fim > ini)) { ini = 480; fim = 1080; }
    return { municipio: municipio, pontos_facultativos: pf, inicioMin: ini, fimMin: fim,
             chave: (municipio || "-") + "|" + (pf ? 1 : 0) + "|" + ini + "-" + fim };
  }

  function feriadosDoAno(ano, cal) {
    var c = calendarioDe(cal), k = ano + "|" + c.chave;
    if (cacheFeriados[k]) return cacheFeriados[k];
    var lista = [];
    function add(d, nome, tipo) { lista.push({ data: chaveDia(d), nome: nome, tipo: tipo }); }
    NACIONAIS_FIXOS.forEach(function (f) { add(new Date(ano, f.mes - 1, f.dia), f.nome, "nacional"); });
    var p = pascoa(ano);
    add(somarDias(p, -2), "Sexta-feira Santa", "nacional");
    (MUNICIPAIS[c.municipio] || []).forEach(function (f) { add(new Date(ano, f.mes - 1, f.dia), f.nome, "municipal"); });
    if (c.pontos_facultativos) {
      add(somarDias(p, -48), "Carnaval", "ponto_facultativo");
      add(somarDias(p, -47), "Carnaval", "ponto_facultativo");
      add(somarDias(p, 60), "Corpus Christi", "ponto_facultativo");
    }
    lista.sort(function (x, y) { return x.data < y.data ? -1 : x.data > y.data ? 1 : 0; });
    var mapa = {};
    lista.forEach(function (f) { if (!mapa[f.data]) mapa[f.data] = f; });
    cacheFeriados[k] = { lista: lista, mapa: mapa };
    return cacheFeriados[k];
  }

  // Feriados e pontos facultativos do ano: [{ data: "AAAA-MM-DD", nome, tipo: "nacional" | "municipal" | "ponto_facultativo" }]
  function feriados(ano, calendario) { return clonar(feriadosDoAno(ano, calendario).lista); }

  // O feriado (ou ponto facultativo) daquele dia, ou null.
  function feriadoEm(d, calendario) {
    var x = exigirData(d), f = feriadosDoAno(x.getFullYear(), calendario).mapa[chaveDia(x)];
    return f ? clonar(f) : null;
  }

  // Segunda a sexta, fora dos feriados e (se ligados) dos pontos facultativos.
  function ehDiaUtil(d, calendario) {
    var w = d.getDay();
    if (w === 0 || w === 6) return false;
    return !feriadosDoAno(d.getFullYear(), calendario).mapa[chaveDia(d)];
  }

  // Avança n dias úteis a partir da data (a data em si não conta).
  function avancarDiasUteis(d, n, calendario) {
    var cal = calendarioDe(calendario), atual = inicioDoDia(d), contados = 0;
    while (contados < n) {
      atual = somarDias(atual, 1);
      if (ehDiaUtil(atual, cal)) contados++;
    }
    return atual;
  }

  // Recua n dias úteis a partir da data (a data em si não conta).
  function recuarDiasUteis(d, n, calendario) {
    var cal = calendarioDe(calendario), atual = inicioDoDia(d), contados = 0;
    while (contados < n) {
      atual = somarDias(atual, -1);
      if (ehDiaUtil(atual, cal)) contados++;
    }
    return atual;
  }

  /*
   * Dias úteis entre duas datas, por dia de calendário: quantos dias úteis d
   * existem com dia(a) < d <= dia(b). Negativo quando b vem antes de a.
   * Ex.: sexta → terça = 2 (segunda e terça); sexta → sábado = 0;
   *      sexta 09/10/2026 → terça 13/10 = 1 (12/10 é feriado).
   */
  function diasUteisEntre(a, b, calendario) {
    var cal = calendarioDe(calendario);
    var x = inicioDoDia(exigirData(a)), y = inicioDoDia(exigirData(b));
    if (x.getTime() === y.getTime()) return 0;
    var sinal = y > x ? 1 : -1, n = 0, guarda = 0;
    var ini = sinal > 0 ? x : y, fim = sinal > 0 ? y : x;
    var atual = ini;
    while (atual < fim && guarda < 4000) {
      atual = somarDias(atual, 1);
      if (ehDiaUtil(atual, cal)) n++;
      guarda++;
    }
    return sinal * n;
  }

  // Desloca d dias úteis (d pode ser negativo; 0 devolve o próprio dia).
  function deslocarDiasUteis(d, n, calendario) {
    if (!n) return inicioDoDia(d);
    return n > 0 ? avancarDiasUteis(d, n, calendario) : recuarDiasUteis(d, -n, calendario);
  }

  // Dia útil de referência: hoje, ou o último dia útil (fim de semana ou feriado).
  function diaDeReferencia(agora, calendario) {
    var cal = calendarioDe(calendario), d = inicioDoDia(exigirData(agora));
    while (!ehDiaUtil(d, cal)) d = somarDias(d, -1);
    return d;
  }

  // ------------------------------------------------------------ expediente e tempo útil
  function noMinuto(d, minutos) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(minutos / 60), minutos % 60, 0, 0);
  }
  // Início e fim do expediente no dia de `d` ("08:00" e "18:00" por padrão).
  function inicioExpediente(d, calendario) { return noMinuto(exigirData(d), calendarioDe(calendario).inicioMin); }
  function fimExpediente(d, calendario) { return noMinuto(exigirData(d), calendarioDe(calendario).fimMin); }

  // Está dentro do expediente de um dia útil (início e fim inclusive)?
  function noExpediente(d, calendario) {
    var cal = calendarioDe(calendario), x = exigirData(d);
    if (!ehDiaUtil(x, cal)) return false;
    var t = x.getTime();
    return t >= noMinuto(x, cal.inicioMin).getTime() && t <= noMinuto(x, cal.fimMin).getTime();
  }

  /*
   * Soma `ms` de tempo útil a partir de `inicio`: só conta o expediente dos dias
   * úteis. Fora do expediente, começa no início do próximo expediente. Quando a
   * soma termina exatamente no fim do expediente, vence nesse horário (e não no
   * início do dia seguinte), como o somar_horas_uteis do MVP.
   * Ex. (08:00–18:00): sexta 16:00 + 4 h = segunda 10:00; terça 22:30 + 4 h =
   * quarta 12:00; sexta 09/10/2026 17:00 + 4 h = terça 13/10 11:00 (12/10).
   */
  function somarTempoUtil(inicio, ms, calendario) {
    var cal = calendarioDe(calendario), t = new Date(exigirData(inicio).getTime()), restante = Math.max(0, ms || 0);
    for (var guarda = 0; guarda < 20000; guarda++) {
      if (!ehDiaUtil(t, cal)) { t = noMinuto(somarDias(t, 1), cal.inicioMin); continue; }
      var ini = noMinuto(t, cal.inicioMin), fim = noMinuto(t, cal.fimMin);
      if (t < ini) t = ini;
      if (t >= fim) { t = noMinuto(somarDias(t, 1), cal.inicioMin); continue; }
      var disponivel = fim.getTime() - t.getTime();
      if (disponivel >= restante) return new Date(t.getTime() + restante);
      restante -= disponivel;
      t = noMinuto(somarDias(t, 1), cal.inicioMin);
    }
    throw erro("prazo_invalido", TEXTOS.erros.prazo_invalido);
  }

  // O inverso: o momento que fica `ms` de tempo útil antes de `fimT`.
  function recuarTempoUtil(fimT, ms, calendario) {
    var cal = calendarioDe(calendario), t = new Date(exigirData(fimT).getTime()), restante = Math.max(0, ms || 0);
    for (var guarda = 0; guarda < 20000; guarda++) {
      if (!ehDiaUtil(t, cal)) { t = noMinuto(somarDias(t, -1), cal.fimMin); continue; }
      var ini = noMinuto(t, cal.inicioMin), fim = noMinuto(t, cal.fimMin);
      if (t > fim) t = fim;
      if (t <= ini) { t = noMinuto(somarDias(t, -1), cal.fimMin); continue; }
      var disponivel = t.getTime() - ini.getTime();
      if (disponivel >= restante) return new Date(t.getTime() - restante);
      restante -= disponivel;
      t = noMinuto(somarDias(t, -1), cal.fimMin);
    }
    throw erro("prazo_invalido", TEXTOS.erros.prazo_invalido);
  }

  // Tempo útil (ms) entre a e b: a parte do intervalo que cai no expediente dos dias úteis.
  function tempoUtilEntre(a, b, calendario) {
    var cal = calendarioDe(calendario), x = exigirData(a), y = exigirData(b);
    if (y.getTime() <= x.getTime()) return 0;
    var total = 0, dia = inicioDoDia(x);
    for (var guarda = 0; dia.getTime() <= y.getTime() && guarda < 6000; guarda++) {
      if (ehDiaUtil(dia, cal)) {
        var ini = Math.max(noMinuto(dia, cal.inicioMin).getTime(), x.getTime());
        var fim = Math.min(noMinuto(dia, cal.fimMin).getTime(), y.getTime());
        if (fim > ini) total += fim - ini;
      }
      dia = somarDias(dia, 1);
    }
    return total;
  }

  function vertical(id) {
    var v = K.verticais && K.verticais[id];
    if (!v) throw erro("vertical_inexistente", preencher(TEXTOS.erros.vertical_inexistente, { valor: id }), { campo: "vertical" });
    return v;
  }

  function generoDe(arg) {
    if (arg === "f" || arg === "m") return arg;
    if (typeof arg === "string" && K.verticais && K.verticais[arg]) return K.verticais[arg].pedido.genero;
    if (arg && typeof arg === "object" && (arg.genero === "f" || arg.genero === "m")) return arg.genero;
    return "m";
  }

  function tipoDe(verticalId, tipoId) {
    var v = vertical(verticalId);
    for (var i = 0; i < v.tipos.length; i++) if (v.tipos[i].id === tipoId) return v.tipos[i];
    return null;
  }

  function rotuloEstado(verticalId, estado) {
    var v = K.verticais && K.verticais[verticalId];
    return (v && v.estados[estado]) || estado;
  }

  // "WhatsApp" · "Telefone" · o rótulo presencial da vertical ("Balcão", "Presencial", "Recepção")
  function rotuloCanal(verticalId, canal) {
    var v = K.verticais && K.verticais[verticalId];
    if (canal === "balcao" && v && v.canal_presencial) return v.canal_presencial;
    return TEXTOS.canais[canal] || canal;
  }

  // "pelo WhatsApp" · "por telefone" · "no balcão da secretaria"
  function fraseCanal(verticalId, canal) {
    var v = K.verticais && K.verticais[verticalId];
    if (canal === "balcao") return (v && v.textos && v.textos.presencial_frase) || "presencialmente";
    return TEXTOS.canal_frase[canal] || canal;
  }

  function vazio(s) { return typeof s !== "string" || s.trim() === ""; }

  function minusculaInicial(s) { return s ? s.charAt(0).toLowerCase() + s.slice(1) : s; }

  function maiusculaInicial(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  // ------------------------------------------------------ gênero e papel
  function artigo(g) { return g === "f" ? "a" : "o"; }
  function aoA(g) { return g === "f" ? "à" : "ao"; }
  function doDa(g) { return g === "f" ? "da" : "do"; }

  // Quem pediu, com nome e gênero. Pedidos antigos só têm solicitante_rotulo.
  function solicitanteDe(pedido) {
    var cfg = pedido && K.verticais && K.verticais[pedido.vertical];
    var s = pedido && pedido.solicitante;
    var nome = (s && s.nome) || (pedido && pedido.solicitante_rotulo) || "";
    return {
      nome: nome,
      curto: (s && s.curto) || nome.split(/\s+/)[0] || nome,
      genero: s && (s.genero === "f" || s.genero === "m") ? s.genero : "m",
      papel: (s && s.papel) || (cfg && cfg.solicitante.papel) || null,
      info: (s && s.info) || "",
      id: (s && s.id) || ""
    };
  }

  // "aluna", "síndico", "interessada na locação"...
  function nomePapel(solicitante, verticalId) {
    var p = solicitante && TEXTOS.papeis[solicitante.papel];
    if (p) return p[solicitante.genero === "f" ? "f" : "m"];
    var cfg = K.verticais && K.verticais[verticalId];
    return cfg ? cfg.solicitante.singular : "";
  }

  // Rótulo do estado para UM pedido: "Aguardando a aluna", "Aguardando o síndico".
  function rotuloEstadoPedido(pedido) {
    if (pedido && pedido.estado === "aguardando" && pedido.solicitante && TEXTOS.papeis[pedido.solicitante.papel]) {
      var s = solicitanteDe(pedido);
      return preencher(TEXTOS.aguardando_quem, { artigo: artigo(s.genero), papel: nomePapel(s, pedido.vertical) });
    }
    return rotuloEstado(pedido && pedido.vertical, pedido && pedido.estado);
  }

  // ------------------------------------------------------------- formatação
  function doisDigitos(n) { return (n < 10 ? "0" : "") + n; }

  // "08:00" (COPY_DECK: horário hh:mm, sem "h")
  function formatarHora(x) {
    var d = exigirData(x);
    return doisDigitos(d.getHours()) + ":" + doisDigitos(d.getMinutes());
  }

  function formatarData(x) {
    var d = exigirData(x);
    return doisDigitos(d.getDate()) + "/" + doisDigitos(d.getMonth() + 1) + "/" + d.getFullYear();
  }

  // "18/09"
  function formatarDiaMes(x) {
    var d = exigirData(x);
    return doisDigitos(d.getDate()) + "/" + doisDigitos(d.getMonth() + 1);
  }

  // "sexta-feira, 02/10"
  function formatarDiaLongo(x) {
    var d = exigirData(x);
    return TEXTOS.datas.dias_semana[d.getDay()] + ", " + formatarDiaMes(d);
  }

  // "terça-feira, 22 de setembro"
  function formatarDataExtensa(x) {
    var d = exigirData(x);
    return TEXTOS.datas.dias_semana[d.getDay()] + ", " + d.getDate() + " de " + TEXTOS.datas.meses[d.getMonth()];
  }

  // "hoje, às 14:30" · "amanhã, às 18:00" · "ontem, às 18:00" · "quinta-feira, 24/09, às 18:00"
  function formatarVencimento(venc, agora) {
    var v = exigirData(venc), a = exigirData(agora);
    var dif = diferencaDias(a, v), dia;
    if (dif === 0) dia = TEXTOS.datas.hoje;
    else if (dif === 1) dia = TEXTOS.datas.amanha;
    else if (dif === -1) dia = TEXTOS.datas.ontem;
    else dia = formatarDiaLongo(v);
    return preencher(TEXTOS.datas.dia_e_hora, { dia: dia, hora: formatarHora(v) });
  }

  /*
   * Até quando vai o prazo, na voz de quem fala com o solicitante.
   * longo: dias úteis "sexta-feira, 25/09"; horas "hoje, às 14:30"
   * curto: dias úteis "25/09"; horas "hoje, 14:30" ou "23/09, 09:15"
   */
  function formatarAte(venc, unidade, agora, curto) {
    var v = exigirData(venc), a = exigirData(agora || venc);
    if (unidade !== "horas") return curto ? formatarDiaMes(v) : formatarDiaLongo(v);
    var dif = diferencaDias(a, v);
    if (curto) return (dif === 0 ? TEXTOS.datas.hoje : formatarDiaMes(v)) + ", " + formatarHora(v);
    return formatarVencimento(v, a);
  }

  // "Bom dia" (00:00–11:59) · "Boa tarde" (12:00–17:59) · "Boa noite" (18:00–23:59), na hora local
  function saudacao(agora) {
    var h = exigirData(agora).getHours();
    return h < 12 ? TEXTOS.saudacoes.manha : h < 18 ? TEXTOS.saudacoes.tarde : TEXTOS.saudacoes.noite;
  }

  // "30 dias úteis" · "1 dia útil" · "4 horas"
  function rotuloPrazo(prazo) {
    var u = TEXTOS.unidades[prazo && prazo.unidade];
    if (!u) return "";
    return prazo.valor + " " + (prazo.valor === 1 ? u.um : u.varios);
  }

  // ------------------------------------------------------------ vencimento
  function validarPrazo(prazo) {
    var ok = prazo && typeof prazo.valor === "number" && isFinite(prazo.valor) && prazo.valor >= 0 &&
      Math.floor(prazo.valor) === prazo.valor && (prazo.unidade === "dias_uteis" || prazo.unidade === "horas");
    if (!ok) throw erro("prazo_invalido", TEXTOS.erros.prazo_invalido, { campo: "prazo" });
  }

  // Depois do fim do expediente (o fim em ponto ainda conta como dentro).
  function depoisDoExpediente(a, calendario) {
    return a.getTime() > noMinuto(a, calendarioDe(calendario).fimMin).getTime();
  }

  // Dia zero da contagem em dias úteis (ver calcularVencimento).
  function diaZero(abertoEm, calendario) {
    var cal = calendarioDe(calendario), a = exigirData(abertoEm), base = inicioDoDia(a);
    if (ehDiaUtil(a, cal) && depoisDoExpediente(a, cal)) base = avancarDiasUteis(base, 1, cal);
    return base;
  }

  /*
   * dias_uteis: sábado, domingo, feriados e (se ligados) pontos facultativos
   *   não contam; o dia da abertura é o dia zero; vence no fim do expediente
   *   (18:00) do último dia útil contado. Aberto num dia útil depois do fim do
   *   expediente, o dia zero passa a ser o próximo dia útil. Aberto no fim de
   *   semana ou num feriado, o dia zero é o próprio dia (o primeiro dia útil é o dia 1).
   *   Ex.: sexta 10:00 + 2 = terça 18:00; sexta 19:00 + 1 = terça 18:00;
   *   sábado + 1 = segunda 18:00; sexta 09/10/2026 + 2 = quarta 14/10 18:00
   *   (12/10 é feriado).
   * horas: horas úteis, só dentro do expediente dos dias úteis (somarTempoUtil).
   *   Ex.: sexta 16:00 + 4 = segunda 10:00; terça 22:30 + 4 = quarta 12:00.
   * calendario: id da vertical, objeto { municipio, pontos_facultativos, expediente } ou nada.
   */
  function calcularVencimento(abertoEm, prazo, calendario) {
    var a = exigirData(abertoEm);
    validarPrazo(prazo);
    var cal = calendarioDe(calendario);
    if (prazo.unidade === "horas") return somarTempoUtil(a, prazo.valor * 3600000, cal);
    var dia = avancarDiasUteis(diaZero(a, cal), prazo.valor, cal);
    if (!ehDiaUtil(dia, cal)) dia = avancarDiasUteis(dia, 1, cal); // só acontece com prazo 0 em dia não útil
    return noMinuto(dia, cal.fimMin);
  }

  // ------------------------------------------------------------ situação
  /*
   * situacaoPrazo(vencimento, agora, concluido, genero?, opcoes?)
   *   concluido: false | true (concluído agora) | Date/ISO do concluido_em.
   *   genero: "f" | "m" | id da vertical. Sem ele, usa o masculino.
   *   opcoes.unidade: "dias_uteis" (padrão) | "horas" — só muda a linha de data.
   *   opcoes.calendario: como em calcularVencimento; sem ele, usa o da vertical
   *     passada em `genero` (se for um id) ou o padrão.
   * Devolve { codigo, texto, detalhe, selo, tom, diasRestantes, diasAtraso }.
   *   codigo: "no_prazo" | "vence_hoje" | "vencido" | "concluido_no_prazo" | "concluido_com_atraso"
   *   selo:   "ok" | "soon" (vence em 1 ou 2 dias úteis) | "today" | "crit" | "done" | "late"
   *   Contagens em dias úteis (COPY_DECK 3.1). Em "Aguardando" nada muda: o
   *   prazo corre normalmente.
   */
  function situacaoPrazo(vencimento, agora, concluido, genero, opcoes) {
    var v = exigirData(vencimento), a = exigirData(agora), g = generoDe(genero);
    var horas = opcoes && opcoes.unidade === "horas";
    var cal = calendarioDe(opcoes && opcoes.calendario !== undefined ? opcoes.calendario
      : (typeof genero === "string" && K.verticais && K.verticais[genero] ? genero : undefined));
    var T = TEXTOS.prazo, D = TEXTOS.detalhe_prazo;
    function dataCurta(d) { return formatarDiaMes(d) + (horas ? ", " + formatarHora(d) : ""); }

    if (concluido) {
      var fim = (concluido === true) ? a : (paraData(concluido) || a);
      var noPrazo = fim.getTime() <= v.getTime();
      var atraso = noPrazo ? 0 : Math.max(0, diasUteisEntre(v, fim, cal));
      return {
        codigo: noPrazo ? "concluido_no_prazo" : "concluido_com_atraso",
        texto: porGenero(noPrazo ? T.concluido_no_prazo : T.concluido_com_atraso, g),
        detalhe: preencher(porGenero(D.concluido, g), { data: formatarDiaMes(fim) }),
        selo: noPrazo ? "done" : "late",
        diasRestantes: noPrazo ? diasUteisEntre(fim, v, cal) : -atraso,
        diasAtraso: atraso,
        tom: noPrazo ? "ok" : "neutro"
      };
    }

    if (v.getTime() < a.getTime()) {
      var mesmo = mesmoDia(v, a);
      var n = mesmo ? 0 : Math.max(1, diasUteisEntre(v, a, cal));
      var texto = n === 0 ? porGenero(T.vencido_hoje, g)
        : n === 1 ? porGenero(T.vencido_1_dia, g)
        : preencher(porGenero(T.vencido_n_dias, g), { n: n });
      return {
        codigo: "vencido", texto: texto,
        detalhe: preencher(D.vencido, { data: mesmo ? TEXTOS.datas.hoje + ", " + formatarHora(v) : formatarDiaMes(v) }),
        selo: "crit", diasRestantes: -n, diasAtraso: n, tom: "alerta"
      };
    }

    if (mesmoDia(v, a)) {
      return {
        codigo: "vence_hoje", texto: T.vence_hoje,
        detalhe: preencher(D.vence_hoje, { data: horas ? formatarHora(v) : formatarDiaMes(v) }),
        selo: "today", diasRestantes: 0, diasAtraso: 0, tom: "atencao"
      };
    }

    var dias = Math.max(1, diasUteisEntre(a, v, cal));
    return {
      codigo: "no_prazo",
      texto: dias === 1 ? T.vence_em_1 : dias === 2 ? preencher(T.vence_em_n, { n: 2 }) : T.no_prazo,
      detalhe: preencher(D.ate, { data: dataCurta(v) }),
      selo: dias <= 2 ? "soon" : "ok",
      diasRestantes: dias, diasAtraso: 0,
      tom: dias <= 2 ? "atencao" : "ok"
    };
  }

  function unidadeDoPedido(pedido) {
    var cfg = pedido && K.verticais && K.verticais[pedido.vertical];
    if (!cfg) return "dias_uteis";
    for (var i = 0; i < cfg.tipos.length; i++) if (cfg.tipos[i].id === pedido.tipo_id) return cfg.tipos[i].prazo.unidade;
    return "dias_uteis";
  }

  // Atalho: a situação de um pedido, com o gênero e a unidade de prazo dele.
  function situacaoPedido(pedido, agora) {
    var concluido = pedido.estado === "concluido" ? (pedido.concluido_em || true) : false;
    return situacaoPrazo(pedido.vencimento, agora, concluido, pedido.vertical, { unidade: unidadeDoPedido(pedido), calendario: pedido.vertical });
  }

  /*
   * Régua de prazo (DESIGN_SYSTEM 5.3): quanto do prazo do tipo já passou.
   * -> { total, usados, unidade, pct, segmentado, selo, rotulo }
   */
  function regua(pedido, agora) {
    var tipo = pedido && K.verticais && K.verticais[pedido.vertical] ? tipoDe(pedido.vertical, pedido.tipo_id) : null;
    var prazo = tipo ? tipo.prazo : { valor: 1, unidade: "dias_uteis" };
    var sit = situacaoPedido(pedido, agora);
    var fim = pedido.estado === "concluido" && pedido.concluido_em ? exigirData(pedido.concluido_em) : exigirData(agora);
    var total = prazo.valor, usados;
    if (prazo.unidade === "horas") usados = Math.floor(tempoUtilEntre(pedido.aberto_em, fim, pedido.vertical) / 3600000);
    else usados = diasUteisEntre(diaZero(pedido.aberto_em, pedido.vertical), fim, pedido.vertical);
    usados = Math.max(0, Math.min(total, usados));
    if (sit.selo === "crit") usados = total;
    var pct = total <= 0 || sit.selo === "crit" ? 100 : Math.max(4, Math.round(usados / total * 100));
    var R = TEXTOS.regua[prazo.unidade] || TEXTOS.regua.dias_uteis;
    var rotulo = preencher(total === 1 ? R.um : R.varios, { u: usados, t: total });
    if (sit.selo === "crit") rotulo += " · " + minusculaInicial(sit.texto);
    return { total: total, usados: usados, unidade: prazo.unidade, pct: pct, segmentado: total > 1 && total <= 15,
             selo: sit.selo, rotulo: rotulo };
  }

  /*
   * Alertas de prazo, como o monitor do MVP (product/core/jobs.py): um aviso
   * quando 75% do prazo foi consumido e um alerta quando o prazo vence, para o
   * supervisor. Uma vez por estado; nada de reaviso diário. Derivados do
   * pedido e de "agora" (a demo não roda o job; mostra o que ele teria feito).
   * Os 75% são de TEMPO ÚTIL (expediente dos dias úteis), então o aviso cai
   * sempre dentro do expediente; o alerta de vencido sai no vencimento.
   * -> [{ acao: "alerta_risco" | "alerta_vencido", em, titulo, texto }]
   */
  function alertasPrazo(pedido, agora) {
    var a = exigirData(agora), out = [];
    var ab = paraData(pedido && pedido.aberto_em), ve = paraData(pedido && pedido.vencimento);
    if (!ab || !ve) return out;
    var cfg = K.verticais && K.verticais[pedido.vertical];
    var sup = cfg ? cfg.supervisor : { nome: "a supervisão", cargo: "equipe" };
    var vars = { supervisor: sup.nome, cargo: minusculaInicial(sup.cargo) };
    var fim = pedido.estado === "concluido" && pedido.concluido_em ? exigirData(pedido.concluido_em) : null;
    var cal = calendarioDe(pedido.vertical);
    var util = tempoUtilEntre(ab, ve, cal);
    var tRisco = util > 0 ? somarTempoUtil(ab, FRACAO_RISCO * util, cal).getTime() : null;
    if (tRisco !== null && tRisco <= a.getTime() && tRisco < ve.getTime() && (!fim || fim.getTime() > tRisco)) {
      out.push({ acao: "alerta_risco", em: new Date(tRisco).toISOString(),
                 titulo: TEXTOS.alertas.risco_titulo, texto: preencher(TEXTOS.alertas.risco_texto, vars) });
    }
    if (ve.getTime() <= a.getTime() && (!fim || fim.getTime() > ve.getTime())) {
      out.push({ acao: "alerta_vencido", em: ve.toISOString(),
                 titulo: TEXTOS.alertas.vencido_titulo, texto: preencher(TEXTOS.alertas.vencido_texto, vars) });
    }
    return out;
  }

  /*
   * Texto da etapa "Concluído" no acompanhamento de quem pediu:
   *   concluído: "Em 24/09"; vencido e em aberto: "Prazo vencido · aguardando
   *   conclusão" (nunca uma previsão com data que já passou); senão:
   *   "Previsão: até 25/09" (horas: "Previsão: até hoje, 14:30").
   */
  function etapaConclusao(pedido, agora) {
    var A = TEXTOS.acompanhamento;
    if (pedido.estado === "concluido" && pedido.concluido_em) return preencher(A.concluido_em, { data: formatarDiaMes(pedido.concluido_em) });
    if (situacaoPedido(pedido, agora).codigo === "vencido") return A.vencido;
    return preencher(A.previsao, { data: formatarAte(pedido.vencimento, unidadeDoPedido(pedido), agora, true) });
  }

  // Na voz da IA (COPY_DECK 3.4): "recebido e na fila" · "em análise" · ...
  function vozEstado(pedido) { return TEXTOS.ia.estado_voz[pedido.estado] || rotuloEstado(pedido.vertical, pedido.estado); }

  // "vence hoje" · "vence amanhã" · "vai até sexta-feira, 02/10" · "venceu em ..., e a equipe já foi alertada"
  function vozPrazo(pedido, agora) {
    var a = exigirData(agora), v = exigirData(pedido.vencimento), P = TEXTOS.ia.prazo_voz;
    var sit = situacaoPedido(pedido, a), unidade = unidadeDoPedido(pedido);
    if (pedido.estado === "concluido") return P.concluido;
    if (sit.codigo === "vencido") return preencher(P.venceu, { data: unidade === "horas" && mesmoDia(v, a) ? TEXTOS.datas.hoje + ", às " + formatarHora(v) : formatarDiaLongo(v) });
    if (sit.codigo === "vence_hoje") return P.hoje;
    if (diferencaDias(a, v) === 1) return P.amanha;
    return preencher(P.ate, { data: formatarAte(v, unidade, a) });
  }

  // ------------------------------------------------------------ transições
  function transicoesValidas(estado) {
    return TRANSICOES[estado] ? TRANSICOES[estado].slice() : [];
  }

  function aplicarTransicao(pedido, novoEstado, autor, agora, nota) {
    var vId = pedido && pedido.vertical;
    var cfg = K.verticais && K.verticais[vId];
    var de = pedido && pedido.estado;
    if (!pedido || ESTADOS.indexOf(de) < 0 || ESTADOS.indexOf(novoEstado) < 0 ||
        transicoesValidas(de).indexOf(novoEstado) < 0) {
      var texto;
      if (de === "concluido" && cfg) {
        texto = preencher(porGenero(TEXTOS.erros.transicao_final, cfg.pedido.genero), { pedido: cfg.pedido.singular });
      } else if (pedido && ESTADOS.indexOf(novoEstado) < 0) {
        texto = preencher(TEXTOS.erros.estado_desconhecido, { valor: novoEstado });
      } else {
        texto = preencher(TEXTOS.erros.transicao_invalida, { de: rotuloEstado(vId, de), para: rotuloEstado(vId, novoEstado) });
      }
      throw erro("transicao_invalida", texto, { de: de, para: novoEstado });
    }
    var em = iso(agora);
    var novo = clonar(pedido);
    var evento = { em: em, autor: autor || TEXTOS.autores.atendente, acao: "transicao", de: de, para: novoEstado, nota: nota || null };
    novo.estado = novoEstado;
    novo.historico = (novo.historico || []).concat([evento]);
    if (!novo.primeira_resposta_em) novo.primeira_resposta_em = em;
    novo.concluido_em = novoEstado === "concluido" ? em : null;
    if (novoEstado === "aguardando" && !vazio(nota)) novo.o_que_falta = nota.trim();
    return { pedido: novo, evento: evento };
  }

  function atribuirResponsavel(pedido, responsavel, autor, agora, nota) {
    var em = iso(agora);
    var novo = clonar(pedido);
    var evento = { em: em, autor: autor || TEXTOS.autores.atendente, acao: "atribuicao",
                   de: pedido.responsavel || null, para: responsavel || null, nota: nota || null };
    novo.responsavel = responsavel || null;
    novo.historico = (novo.historico || []).concat([evento]);
    return { pedido: novo, evento: evento };
  }

  // Resposta a quem pediu: vai para o histórico e para o acompanhamento do protocolo.
  function registrarResposta(pedido, texto, autor, agora) {
    if (vazio(texto)) throw erro("resposta_vazia", TEXTOS.erros.resposta_vazia, { campo: "texto" });
    var em = iso(agora);
    var novo = clonar(pedido);
    var evento = { em: em, autor: autor || TEXTOS.autores.atendente, acao: "resposta", de: null, para: null, nota: texto.trim() };
    novo.historico = (novo.historico || []).concat([evento]);
    if (!novo.primeira_resposta_em) novo.primeira_resposta_em = em;
    return { pedido: novo, evento: evento };
  }

  // Nota interna: só a equipe vê; nunca aparece no acompanhamento.
  function registrarNota(pedido, texto, autor, agora) {
    if (vazio(texto)) throw erro("nota_vazia", TEXTOS.erros.nota_vazia, { campo: "texto" });
    var em = iso(agora);
    var novo = clonar(pedido);
    var evento = { em: em, autor: autor || TEXTOS.autores.atendente, acao: "nota", de: null, para: null, nota: texto.trim() };
    novo.historico = (novo.historico || []).concat([evento]);
    return { pedido: novo, evento: evento };
  }

  // Ajuste manual do prazo, sempre registrado no histórico com o motivo.
  function ajustarPrazo(pedido, novoVencimento, autor, agora, nota) {
    if (pedido.estado === "concluido") throw erro("prazo_invalido", TEXTOS.erros.ajuste_em_concluido);
    var em = iso(agora);
    var venc = iso(novoVencimento);
    var novo = clonar(pedido);
    var evento = { em: em, autor: autor || TEXTOS.autores.atendente, acao: "prazo_ajustado",
                   de: pedido.vencimento, para: venc, nota: nota || null };
    novo.vencimento = venc;
    novo.historico = (novo.historico || []).concat([evento]);
    return { pedido: novo, evento: evento };
  }

  // Quem tem menos pedidos em aberto (empate: a ordem da equipe).
  function distribuicaoAutomatica(pedidos, verticalId) {
    var v = vertical(verticalId), melhor = v.responsaveis[0], menor = Infinity;
    v.responsaveis.forEach(function (nome) {
      var n = (pedidos || []).filter(function (p) {
        return p && p.vertical === verticalId && p.estado !== "concluido" && p.responsavel === nome;
      }).length;
      if (n < menor) { menor = n; melhor = nome; }
    });
    return melhor;
  }

  // ------------------------------------------------------------ protocolo
  // "VA-24815": prefixo da organização + número (formato do protótipo).
  function novoProtocolo(verticalId, sequencial, data) {
    var v = vertical(verticalId);
    if (typeof sequencial !== "number" || Math.floor(sequencial) !== sequencial || sequencial < 1 || sequencial > 999999) {
      throw erro("sequencial_invalido", preencher(TEXTOS.erros.sequencial_invalido, { valor: sequencial }));
    }
    if (data !== undefined) exigirData(data);
    return v.prefixo + "-" + sequencial;
  }

  function lerProtocolo(protocolo) {
    var m = /^([A-Z]{2,3})-(\d{1,6})$/.exec(protocolo || "");
    return m ? { prefixo: m[1], sequencial: +m[2] } : null;
  }

  // Próximo número da vertical: max(protocolo_base, maior existente) + 1.
  function proximoSequencial(pedidos, verticalId) {
    var v = vertical(verticalId), maior = v.protocolo_base || 0;
    (pedidos || []).forEach(function (p) {
      var l = lerProtocolo(p && p.protocolo);
      if (l && l.prefixo === v.prefixo && l.sequencial > maior) maior = l.sequencial;
    });
    return maior + 1;
  }

  // ------------------------------------------------------------ criação
  /*
   * criarPedido(dados, vertical, agora, pedidosExistentes?)
   *   dados: { tipo_id, canal, descricao,
   *            solicitante_rotulo? | solicitante? {nome, curto?, genero, papel, info, id},
   *            dados? [[rótulo, valor]], o_que_falta?, aberto_por?, novo?,
   *            responsavel?, evento_externo_id?, atendimento_ia?, autor?,
   *            nota?, motivo_ia?, sequencial? }
   *   O sequencial vem de dados.sequencial ou é o próximo depois dos
   *   pedidosExistentes. Sem `responsavel`, usa a distribuição automática.
   *   NÃO verifica idempotência: chame idempotencia() antes (o
   *   Kayan.store.criarPedido já faz as duas coisas).
   */
  function criarPedido(dados, verticalId, agora, pedidosExistentes) {
    var v = vertical(verticalId);
    dados = dados || {};
    var tipo = tipoDe(verticalId, dados.tipo_id);
    if (!tipo) {
      throw erro("tipo_inexistente", preencher(TEXTOS.erros.tipo_inexistente,
        { vertical: v.rotulo_vertical, valor: dados.tipo_id == null ? "" : dados.tipo_id }), { campo: "tipo_id" });
    }
    if (CANAIS.indexOf(dados.canal) < 0) {
      throw erro("canal_invalido", preencher(TEXTOS.erros.canal_invalido, { valor: dados.canal == null ? "" : dados.canal }), { campo: "canal" });
    }
    var sol = dados.solicitante && typeof dados.solicitante === "object" ? dados.solicitante : null;
    var rotulo = !vazio(dados.solicitante_rotulo) ? dados.solicitante_rotulo : (sol && !vazio(sol.nome) ? sol.nome : "");
    if (vazio(rotulo)) {
      throw erro("solicitante_vazio", preencher(porGenero(TEXTOS.erros.solicitante_vazio, v.solicitante.genero),
        { solicitante: v.solicitante.singular }), { campo: "solicitante_rotulo" });
    }
    if (vazio(dados.descricao)) {
      throw erro("descricao_vazia", preencher(porGenero(TEXTOS.erros.descricao_vazia, v.pedido.genero),
        { pedido: v.pedido.singular }), { campo: "descricao" });
    }
    var atendimentoIa = ATENDIMENTO_IA.indexOf(dados.atendimento_ia) >= 0 ? dados.atendimento_ia : null;
    var a = exigirData(agora);
    var em = a.toISOString();
    var seq = dados.sequencial != null ? dados.sequencial : proximoSequencial(pedidosExistentes, verticalId);
    var protocolo = novoProtocolo(verticalId, seq);
    var responsavel = dados.responsavel !== undefined ? (dados.responsavel || null)
      : distribuicaoAutomatica(pedidosExistentes, verticalId);
    var abertoPelaIa = atendimentoIa && !dados.aberto_por;
    var autor = dados.autor || (abertoPelaIa ? TEXTOS.autores.ia : (dados.aberto_por || responsavel || TEXTOS.autores.atendente));

    var historico = [{ em: em, autor: autor, acao: "abertura", de: null, para: "recebido", nota: dados.nota || null }];
    if (atendimentoIa === "passou_para_humano") {
      historico.push({ em: em, autor: TEXTOS.autores.ia, acao: "passou_para_humano", de: null, para: null,
                       nota: dados.motivo_ia || null });
    }
    var solicitante = sol ? {
      nome: String(sol.nome || rotulo).trim(),
      curto: sol.curto || null,
      genero: sol.genero === "f" ? "f" : "m",
      papel: sol.papel || v.solicitante.papel || null,
      info: sol.info || "",
      id: sol.id || ""
    } : null;
    return {
      id: protocolo,
      protocolo: protocolo,
      vertical: verticalId,
      tipo_id: tipo.id,
      canal: dados.canal,
      solicitante_rotulo: rotulo.trim(),
      solicitante: solicitante,
      descricao: dados.descricao.trim(),
      dados: Array.isArray(dados.dados) ? clonar(dados.dados) : [],
      o_que_falta: vazio(dados.o_que_falta) ? null : dados.o_que_falta.trim(),
      estado: "recebido",
      responsavel: responsavel,
      aberto_por: vazio(dados.aberto_por) ? null : dados.aberto_por,
      aberto_em: em,
      vencimento: calcularVencimento(a, tipo.prazo, verticalId).toISOString(),
      primeira_resposta_em: atendimentoIa ? em : null, // a IA responde na hora, com protocolo e prazo
      concluido_em: null,
      evento_externo_id: vazio(dados.evento_externo_id) ? null : dados.evento_externo_id,
      atendimento_ia: atendimentoIa,
      novo: !!dados.novo,
      ficticio: true,
      historico: historico
    };
  }

  function idempotencia(eventoExternoId, pedidosExistentes) {
    if (vazio(eventoExternoId)) return null;
    var lista = pedidosExistentes || [];
    for (var i = 0; i < lista.length; i++) {
      if (lista[i] && lista[i].evento_externo_id === eventoExternoId) return lista[i];
    }
    return null;
  }

  // ------------------------------------------------------------ métricas
  // Primeira ação de uma pessoa da equipe (mudança de estado ou resposta).
  function primeiraRespostaDaEquipe(p) {
    var h = p.historico || [];
    for (var i = 0; i < h.length; i++) {
      if ((h[i].acao === "transicao" || h[i].acao === "resposta") && h[i].autor !== TEXTOS.autores.ia) return paraData(h[i].em);
    }
    return null;
  }

  /*
   * abertos, vencidos, venceHoje e aguardando contam só os não concluídos.
   * noPrazoPct: % do total (abertos + concluídos) que está ou terminou no prazo;
   *   null sem pedidos.
   * tempoMedioPrimeiraRespostaMin: média arredondada entre aberto_em e
   *   primeira_resposta_em nos pedidos que têm resposta (inclui a resposta
   *   automática da IA); null se nenhum.
   * tempoMedioPrimeiraRespostaEquipeMin: média entre aberto_em e a primeira
   *   ação de uma pessoa da equipe (mudança de estado ou resposta); null se
   *   nenhum. respondidosEquipe: quantos pedidos entraram nessa média.
   * porCanal: todos os pedidos, por canal de entrada (as 3 chaves sempre).
   * porResponsavel: pedidos em aberto por responsável (carga atual).
   * iaResolveuSozinha / iaPassouParaHumano: pedidos abertos pela IA, pelo
   *   campo atendimento_ia.
   */
  function metricas(pedidos, agora) {
    var a = exigirData(agora);
    var r = {
      total: 0, abertos: 0, concluidos: 0, vencidos: 0, venceHoje: 0, aguardando: 0, noPrazoPct: null,
      tempoMedioPrimeiraRespostaMin: null, tempoMedioPrimeiraRespostaEquipeMin: null, respondidosEquipe: 0,
      porCanal: {}, porResponsavel: {}, iaResolveuSozinha: 0, iaPassouParaHumano: 0
    };
    CANAIS.forEach(function (c) { r.porCanal[c] = 0; });
    var noPrazo = 0, somaMin = 0, comResposta = 0, somaEq = 0;
    (pedidos || []).forEach(function (p) {
      if (!p) return;
      r.total++;
      if (r.porCanal[p.canal] !== undefined) r.porCanal[p.canal]++;
      var sit = situacaoPedido(p, a);
      if (p.estado === "concluido") {
        r.concluidos++;
        if (sit.codigo === "concluido_no_prazo") noPrazo++;
      } else {
        r.abertos++;
        var chave = p.responsavel || TEXTOS.sem_responsavel;
        r.porResponsavel[chave] = (r.porResponsavel[chave] || 0) + 1;
        if (sit.codigo === "vencido") r.vencidos++;
        else noPrazo++;
        if (sit.codigo === "vence_hoje") r.venceHoje++;
        if (p.estado === "aguardando") r.aguardando++;
      }
      var ab = paraData(p.aberto_em), pr = paraData(p.primeira_resposta_em);
      if (ab && pr) { somaMin += Math.max(0, (pr.getTime() - ab.getTime()) / 60000); comResposta++; }
      var eq = primeiraRespostaDaEquipe(p);
      if (ab && eq) { somaEq += Math.max(0, (eq.getTime() - ab.getTime()) / 60000); r.respondidosEquipe++; }
      if (p.atendimento_ia === "resolveu_sozinha") r.iaResolveuSozinha++;
      if (p.atendimento_ia === "passou_para_humano") r.iaPassouParaHumano++;
    });
    if (r.total > 0) r.noPrazoPct = Math.round((noPrazo / r.total) * 100);
    if (comResposta > 0) r.tempoMedioPrimeiraRespostaMin = Math.round(somaMin / comResposta);
    if (r.respondidosEquipe > 0) r.tempoMedioPrimeiraRespostaEquipeMin = Math.round(somaEq / r.respondidosEquipe);
    return r;
  }

  /*
   * Métricas das conversas com a IA, a partir dos EVENTOS da Kayan.iaSimulada
   * (nada fixo). Cada conversa conta uma vez, pelo desfecho:
   *   passaram  = teve "passou_para_humano";
   *   abriram   = a IA abriu o pedido e não passou para humano;
   *   resolvidas = "resolvido" sem pedido aberto pela IA e sem passagem.
   * primeiraRespostaSeg: média entre a primeira mensagem de quem pediu e a
   *   primeira resposta da IA, em segundos; null sem dados.
   * opcoes.desde: considera só eventos a partir dessa data.
   */
  function metricasIA(eventos, opcoes) {
    var desde = opcoes && opcoes.desde ? exigirData(opcoes.desde).getTime() : null;
    var conv = {};
    (eventos || []).forEach(function (e) {
      if (!e || !e.conversaId) return;
      var t = paraData(e.em);
      if (desde !== null && (!t || t.getTime() < desde)) return;
      var c = conv[e.conversaId] || (conv[e.conversaId] = { sol: null, ia: null, abriu: false, passou: false, resolveu: false });
      if (e.tipo === "mensagem" && e.autor === "solicitante" && !c.sol && t) c.sol = t.getTime();
      if (e.tipo === "mensagem" && e.autor === "ia" && !c.ia && t) c.ia = t.getTime();
      if (e.tipo === "pedido_aberto" && e.por !== "atendente") c.abriu = true;
      if (e.tipo === "passou_para_humano") c.passou = true;
      if (e.tipo === "resolvido") c.resolveu = true;
    });
    var r = { conversas: 0, resolvidas: 0, abriram: 0, passaram: 0, primeiraRespostaSeg: null };
    var soma = 0, n = 0;
    Object.keys(conv).forEach(function (id) {
      var c = conv[id];
      if (c.passou) r.passaram++;
      else if (c.abriu) r.abriram++;
      else if (c.resolveu) r.resolvidas++;
      if (c.sol !== null && c.ia !== null && c.ia >= c.sol) { soma += (c.ia - c.sol) / 1000; n++; }
    });
    r.conversas = r.resolvidas + r.abriram + r.passaram;
    if (n > 0) r.primeiraRespostaSeg = Math.max(1, Math.round(soma / n));
    return r;
  }

  // ------------------------------------------------------------ exportação
  K.motor = {
    TEXTOS: TEXTOS,
    ESTADOS: ESTADOS.slice(),
    CANAIS: CANAIS.slice(),
    HORA_FIM_EXPEDIENTE: HORA_FIM_EXPEDIENTE,

    calcularVencimento: calcularVencimento,
    situacaoPrazo: situacaoPrazo,
    situacaoPedido: situacaoPedido,
    transicoesValidas: transicoesValidas,
    aplicarTransicao: aplicarTransicao,
    atribuirResponsavel: atribuirResponsavel,
    registrarResposta: registrarResposta,
    registrarNota: registrarNota,
    ajustarPrazo: ajustarPrazo,
    novoProtocolo: novoProtocolo,
    lerProtocolo: lerProtocolo,
    proximoSequencial: proximoSequencial,
    criarPedido: criarPedido,
    idempotencia: idempotencia,
    metricas: metricas,
    metricasIA: metricasIA,
    regua: regua,
    alertasPrazo: alertasPrazo,
    etapaConclusao: etapaConclusao,
    somarTempoUtil: somarTempoUtil,
    recuarTempoUtil: recuarTempoUtil,
    tempoUtilEntre: tempoUtilEntre,
    inicioExpediente: inicioExpediente,
    fimExpediente: fimExpediente,
    noExpediente: noExpediente,
    distribuicaoAutomatica: distribuicaoAutomatica,

    // auxiliares de apresentação e de uso interno (cenario, store, IA, telas)
    tipo: tipoDe,
    unidadeDoPedido: unidadeDoPedido,
    rotuloEstado: rotuloEstado,
    rotuloEstadoPedido: rotuloEstadoPedido,
    rotuloCanal: rotuloCanal,
    fraseCanal: fraseCanal,
    rotuloPrazo: rotuloPrazo,
    solicitanteDe: solicitanteDe,
    nomePapel: nomePapel,
    artigo: artigo,
    aoA: aoA,
    doDa: doDa,
    vozEstado: vozEstado,
    vozPrazo: vozPrazo,
    formatarVencimento: formatarVencimento,
    formatarAte: formatarAte,
    saudacao: saudacao,
    formatarData: formatarData,
    formatarDiaMes: formatarDiaMes,
    formatarDiaLongo: formatarDiaLongo,
    formatarDataExtensa: formatarDataExtensa,
    formatarHora: formatarHora,
    preencher: preencher,
    minusculaInicial: minusculaInicial,
    maiusculaInicial: maiusculaInicial,
    ehDiaUtil: ehDiaUtil,
    pascoa: pascoa,
    feriados: feriados,
    feriadoEm: feriadoEm,
    calendarioDe: calendarioDe,
    mesmoDia: mesmoDia,
    diferencaDias: diferencaDias,
    diasUteisEntre: diasUteisEntre,
    deslocarDiasUteis: deslocarDiasUteis,
    diaDeReferencia: diaDeReferencia,
    diaZero: diaZero,
    avancarDiasUteis: avancarDiasUteis,
    recuarDiasUteis: recuarDiasUteis,
    clonar: clonar
  };
})();
