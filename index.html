<script>
/* ---- src/cenario.js ---- */
/*
 * Kayan · demo web — gerador do cenário de demonstração.
 *
 * Kayan.cenario.gerar(vertical, agora) -> pedidos[]
 *
 * DEV-MOTOR escreveu a primeira versão; o DEV-UI (rodada 4) passou a gerar o
 * cenário do protótipo aprovado (mesmas pessoas, protocolos e histórias), com
 * os PRAZOS DO CONTRATO e sem pausa em "Aguardando".
 *
 * Transforma os itens de `Kayan.verticais[v].cenario` em pedidos completos,
 * com datas relativas a `agora`, usando o próprio motor (criarPedido,
 * aplicarTransicao, registrarResposta, registrarNota, ajustarPrazo).
 * Determinístico: o mesmo `agora` gera sempre o mesmo cenário. Tudo fictício
 * (campo `ficticio: true`). Nenhum evento fica no futuro nem antes da abertura.
 *
 * Dia de referência: hoje, ou o último dia útil no fim de semana ou feriado
 * (como no protótipo). `vence: d` põe o vencimento d dias úteis depois dele.
 * Todas as contas usam o calendário da vertical (feriados e pontos
 * facultativos; ver motor.js), então véspera e dia de feriado também valem.
 *
 * Garantia "vence hoje" (item com garantirVenceHoje):
 *   - prazo em horas (horas úteis), dentro do expediente: aberto de modo que
 *     vença até 75 min depois de agora, sem passar do fim do expediente;
 *   - prazo em dias úteis, em dia útil até 30 min antes do fim do expediente:
 *     vence hoje no fim do expediente (18:00);
 *   - fora disso (noite, fim de semana ou feriado), o prazo natural cairia no
 *     próximo expediente, então o item recebe um ajuste de prazo registrado no
 *     histórico (acao "prazo_ajustado", com o motivo). É o único pedido que
 *     pode vencer fora do expediente; todos os outros vencimentos e avisos de
 *     75% caem dentro dele.
 */
(function () {
  "use strict";
  var K = (window.Kayan = window.Kayan || {});

  var MARGEM_VENCE_HOJE_MIN = 75;
  var FOLGA_NATURAL_VENCE_HOJE_MIN = 30; // dias úteis: até 30 min antes do fim do expediente
  var MIN = 60000;

  function M() { return K.motor; }

  function lerHora(s, padrao) {
    var p = /^(\d{1,2}):(\d{2})$/.exec(s || "");
    return p ? [Number(p[1]), Number(p[2])] : (padrao || [9, 0]);
  }

  function noDia(dia, h, m) { return new Date(dia.getFullYear(), dia.getMonth(), dia.getDate(), h, m, 0, 0); }

  function alvoVenceHoje(agora) {
    var fimDoDia = noDia(agora, 23, 59);
    var alvo = new Date(agora.getTime() + MARGEM_VENCE_HOJE_MIN * MIN);
    if (alvo.getTime() > fimDoDia.getTime()) alvo = fimDoDia;
    if (alvo.getTime() <= agora.getTime()) alvo = new Date(agora.getTime() + 30000);
    return alvo;
  }

  // Abre no dia `dia` à hora do item; se a hora cair no futuro, recua para antes de agora.
  function abrirEm(dia, hm, agora, recuoMin) {
    var t = noDia(dia, hm[0], hm[1]);
    if (t.getTime() > agora.getTime() - MIN) t = new Date(agora.getTime() - (recuoMin || 20) * MIN);
    return t;
  }

  // Hoje, dentro do expediente e pelo menos um minuto à frente de agora (ou null).
  function alvoVenceHojeNoExpediente(agora, cal) {
    if (!M().ehDiaUtil(agora, cal)) return null;
    var ini = M().inicioExpediente(agora, cal).getTime(), fim = M().fimExpediente(agora, cal).getTime();
    var alvo = Math.min(Math.max(agora.getTime(), ini) + MARGEM_VENCE_HOJE_MIN * MIN, fim);
    return alvo > agora.getTime() + MIN ? new Date(alvo) : null;
  }

  function planejarVenceHoje(item, tipo, agora, cal) {
    var prazo = tipo.prazo;
    if (prazo.unidade === "horas") {
      var alvoUtil = alvoVenceHojeNoExpediente(agora, cal);
      if (alvoUtil) return { aberto: M().recuarTempoUtil(alvoUtil, prazo.valor * 3600000, cal), ajuste: null };
      // fora do expediente: aberto na última hora útil; o prazo natural cairia no
      // próximo expediente, então recebe um ajuste registrado no histórico
      return {
        aberto: M().recuarTempoUtil(agora, 60 * MIN, cal),
        ajuste: { vencimento: alvoVenceHoje(agora), em: new Date(agora.getTime() - 10 * MIN) }
      };
    }
    var hm = lerHora(item.hora, [10, 0]);
    if (hm[0] * 60 + hm[1] >= cal.fimMin - 60) hm = [10, 0];
    var limite = new Date(M().fimExpediente(agora, cal).getTime() - FOLGA_NATURAL_VENCE_HOJE_MIN * MIN);
    if (prazo.valor >= 1 && M().ehDiaUtil(agora, cal) && agora.getTime() < limite.getTime()) {
      return { aberto: noDia(M().recuarDiasUteis(agora, prazo.valor, cal), hm[0], hm[1]), ajuste: null };
    }
    var dia = M().recuarDiasUteis(agora, Math.max(1, prazo.valor - 1), cal);
    return {
      aberto: noDia(dia, hm[0], hm[1]),
      ajuste: { vencimento: alvoVenceHoje(agora), em: new Date(agora.getTime() - 10 * MIN) }
    };
  }

  /*
   * Momento de abertura de um item em aberto (recebido, em análise, aguardando).
   * dias_uteis: o vencimento cai d dias úteis depois do dia de referência; a
   *   abertura recua o prazo do tipo (um dia a mais se a hora for depois das 18:00).
   * horas: `vence` < 0 abre naquele dia útil; senão usa `minutosAtras`.
   */
  function planejarAberto(item, tipo, agora, ref, cal) {
    if (item.garantirVenceHoje) return planejarVenceHoje(item, tipo, agora, cal);
    if (typeof item.minutosAtras === "number") return { aberto: new Date(agora.getTime() - item.minutosAtras * MIN), ajuste: null };
    var hm = lerHora(item.hora);
    var d = typeof item.vence === "number" ? item.vence : 1;
    if (tipo.prazo.unidade === "horas") {
      if (d < 0) return { aberto: abrirEm(M().deslocarDiasUteis(ref, d, cal), hm, agora), ajuste: null };
      return { aberto: new Date(agora.getTime() - 90 * MIN), ajuste: null };
    }
    var diaVenc = M().deslocarDiasUteis(ref, d, cal);
    var recuo = tipo.prazo.valor + (hm[0] > 18 || (hm[0] === 18 && hm[1] > 0) ? 1 : 0);
    var diaAbertura = M().recuarDiasUteis(diaVenc, recuo, cal);
    return { aberto: abrirEm(diaAbertura, hm, agora), ajuste: null };
  }

  /*
   * Pedido concluído: `concluido.diasAtras` dias úteis antes da referência.
   * folga: o prazo ia além da conclusão (no prazo); atraso: venceu antes.
   */
  function planejarConcluido(item, tipo, agora, ref, cal) {
    var c = item.concluido || {};
    var hm = lerHora(item.hora);
    var diaConcl = M().deslocarDiasUteis(ref, -Math.max(1, c.diasAtras || 1), cal);
    var aberto, concl;
    if (tipo.prazo.unidade === "horas") {
      aberto = noDia(diaConcl, hm[0], hm[1]);
      var venc = M().somarTempoUtil(aberto, tipo.prazo.valor * 3600000, cal);
      concl = c.atraso ? M().somarTempoUtil(venc, 90 * MIN, cal) : M().somarTempoUtil(aberto, tipo.prazo.valor * 1800000, cal);
    } else {
      var diaVenc = c.atraso ? M().deslocarDiasUteis(diaConcl, -c.atraso, cal) : M().deslocarDiasUteis(diaConcl, c.folga || 0, cal);
      aberto = noDia(M().recuarDiasUteis(diaVenc, tipo.prazo.valor, cal), hm[0], hm[1]);
      concl = noDia(diaConcl, 15, 20);
    }
    if (concl.getTime() > agora.getTime()) concl = new Date(agora.getTime() - 5 * MIN);
    if (aberto.getTime() > concl.getTime() - 30 * MIN) aberto = new Date(concl.getTime() - 120 * MIN);
    return { aberto: aberto, concluido: concl };
  }

  // Primeira resposta da equipe: minutos depois da abertura; fora do expediente, logo no começo do próximo.
  function momentoResposta(aberto, minutos, cal) {
    var t = new Date(aberto.getTime() + minutos * MIN);
    if (M().noExpediente(t, cal)) return t;
    var proximo = M().somarTempoUtil(t, 0, cal); // início do próximo expediente
    return new Date(proximo.getTime() + (10 + (minutos % 40)) * MIN);
  }

  function gerar(verticalId, agora) {
    var motor = M();
    var cfg = K.verticais && K.verticais[verticalId];
    if (!cfg) {
      var e = new Error("vertical_inexistente");
      e.codigo = "vertical_inexistente";
      e.texto = motor.preencher(motor.TEXTOS.erros.vertical_inexistente, { valor: verticalId });
      throw e;
    }
    var a = agora ? new Date(agora instanceof Date ? agora.getTime() : agora) : new Date();
    if (isNaN(a.getTime())) a = new Date();
    var tAgora = a.getTime();
    var cal = motor.calendarioDe(verticalId);
    var ref = motor.diaDeReferencia(a, cal);

    var pedidos = cfg.cenario.map(function (item, indice) {
      var tipo = motor.tipo(verticalId, item.tipo);
      if (!tipo) throw new Error("cenario: tipo inexistente " + item.tipo + " em " + verticalId);
      var plano = item.estado === "concluido" ? planejarConcluido(item, tipo, a, ref, cal) : planejarAberto(item, tipo, a, ref, cal);
      var aberto = plano.aberto;
      if (aberto.getTime() > tAgora) aberto = new Date(tAgora - 20 * MIN);
      var resp = item.responsavel === undefined ? cfg.responsaveis[indice % cfg.responsaveis.length] : item.responsavel;
      var ehIa = !!item.ia && item.canal === "whatsapp";
      var autorAbertura = ehIa ? motor.TEXTOS.autores.ia : (item.por || resp || cfg.atendente.nome);

      var p = motor.criarPedido({
        tipo_id: item.tipo,
        canal: item.canal,
        solicitante: item.solicitante,
        descricao: item.descricao,
        dados: item.dados || [],
        o_que_falta: item.o_que_falta || null,
        responsavel: resp,
        aberto_por: ehIa ? null : (item.por || null),
        autor: autorAbertura,
        atendimento_ia: ehIa ? item.ia : null,
        motivo_ia: item.motivo_ia || null,
        evento_externo_id: item.canal === "whatsapp" ? "demo-wa-" + verticalId + "-" + item.seq : null,
        sequencial: item.seq
      }, verticalId, aberto);

      // ---------------------------------------------------- linha do tempo
      var t0 = aberto.getTime();
      var tConcl = plano.concluido ? plano.concluido.getTime() : null;
      var limite = tConcl !== null ? tConcl : tAgora;
      var meio = [];   // respostas, notas e a entrada em "Aguardando", pela hora
      (item.eventos || []).forEach(function (ev) {
        var hm = lerHora(ev.hora);
        var t = noDia(motor.deslocarDiasUteis(aberto, ev.dia || 0, cal), hm[0], hm[1]).getTime();
        if (t <= t0 || t > limite) return; // evento que ainda não aconteceu
        meio.push({ t: t, tipo: ev.tipo, autor: ev.autor || resp, texto: ev.texto });
      });
      if (item.estado === "aguardando") {
        var dAg = item.aguardando && typeof item.aguardando.diasAtras === "number" ? item.aguardando.diasAtras : 1;
        var tAg = noDia(motor.deslocarDiasUteis(ref, -dAg, cal), 10, 30).getTime();
        var nome = motor.solicitanteDe(p).curto;
        meio.push({ t: tAg, tipo: "resposta", autor: resp, texto: "Olá, " + nome + ". " + (item.o_que_falta || ""), ordem: 5 });
        meio.push({ t: tAg + MIN, tipo: "transicao", para: "aguardando", autor: resp, ordem: 6 });
      }
      meio.sort(function (x, y) { return x.t - y.t || (x.ordem || 0) - (y.ordem || 0); });

      // ordem fixa das transições: em análise primeiro, conclusão por último
      var acoes = [];
      if (item.estado !== "recebido") {
        var minutos = item.resposta_min != null ? item.resposta_min : 14 + (indice * 23) % 85;
        var tAn = momentoResposta(aberto, minutos, cal).getTime();
        if (meio.length && tAn >= meio[0].t) tAn = meio[0].t - MIN;
        if (tAn > limite) tAn = t0 + Math.max(MIN, (limite - t0) * 0.2);
        acoes.push({ t: Math.max(tAn, t0 + MIN), tipo: "transicao", para: "em_analise", autor: resp || cfg.atendente.nome });
      }
      acoes = acoes.concat(meio);
      if (item.estado === "concluido") {
        var nomeC = motor.solicitanteDe(p).curto;
        var msg = item.mensagem_conclusao || ("Olá, " + nomeC + ". Seu pedido foi concluído. " + cfg.textos.conclusao);
        acoes.push({ t: tConcl - MIN, tipo: "resposta", autor: resp, texto: msg });
        acoes.push({ t: tConcl, tipo: "transicao", para: "concluido", autor: resp });
      }

      var cursor = t0;
      acoes.forEach(function (ac) {
        var t = Math.min(tAgora, Math.max(ac.t, cursor + 1000));
        if (t < cursor) t = cursor;
        cursor = t;
        var quando = new Date(t);
        if (ac.tipo === "transicao") p = motor.aplicarTransicao(p, ac.para, ac.autor, quando, null).pedido;
        else if (ac.tipo === "resposta") p = motor.registrarResposta(p, ac.texto, ac.autor, quando).pedido;
        else if (ac.tipo === "nota") p = motor.registrarNota(p, ac.texto, ac.autor, quando).pedido;
      });
      if (plano.ajuste) {
        var tAjuste = Math.min(tAgora, Math.max(cursor + MIN, plano.ajuste.em.getTime()));
        p = motor.ajustarPrazo(p, plano.ajuste.vencimento, resp || cfg.atendente.nome, new Date(tAjuste), item.nota_ajuste || null).pedido;
      }
      return p;
    });

    pedidos.sort(function (x, y) {
      var a1 = motor.lerProtocolo(x.protocolo), b1 = motor.lerProtocolo(y.protocolo);
      return (a1 ? a1.sequencial : 0) - (b1 ? b1.sequencial : 0);
    });
    return pedidos;
  }

  K.cenario = { gerar: gerar };
})();
</script>
<script>
/* ---- src/store.js ---- */
/*
 * Kayan · demo web — persistência (DEV-MOTOR).
 *
 * API (assíncrona, a mesma nos dois modos):
 *   await Kayan.store.iniciar()            -> "nuvem" | "local"
 *   Kayan.store.modo()                     -> "nuvem" | "local"
 *   Kayan.store.podeGravarNaNuvem()        -> bool
 *   await Kayan.store.listar(vertical)     -> pedidos[] (cópias, por protocolo)
 *   await Kayan.store.salvar(pedido)       -> { ok, pedido, modo, caiuParaLocal, erro, aviso }
 *   await Kayan.store.restaurar(vertical)  -> { ok, pedidos, modo, caiuParaLocal, erro, aviso }
 *   Kayan.store.aoMudar(vertical, cb)      -> cancelar()
 * Extras:
 *   await Kayan.store.criarPedido(vertical, dados) -> { ...como salvar, duplicado }
 *       protocolo sequencial + idempotência por evento_externo_id
 *   Kayan.store.aoMudarModo(cb)            -> cancelar(); cb(modo, motivo)
 *   Kayan.store.rotuloModo()               -> "Salvo na nuvem" | "Demonstração: as alterações ficam salvas neste aparelho"
 *   Kayan.store.espelhoDisponivel()        -> bool (o localStorage aceita gravar)
 *   Kayan.store.diagnostico()              -> contadores para depuração
 *   Kayan.criarStore(opcoes)               -> nova instância (usada nos testes)
 *
 * Regras:
 *   - aoMudar: UMA função por vertical (chamar de novo substitui a anterior).
 *     Dispara quando os dados da vertical ficam prontos pela primeira vez e a
 *     cada mudança (salvar, criarPedido, restaurar, snapshot da nuvem); não
 *     dispara só por registrar. Estado inicial garantido: listar().
 *   - salvar resolve ok:true também quando a nuvem recusa: nesse caso a
 *     alteração fica na memória e no aparelho, o modo vira "local" e o
 *     resultado traz caiuParaLocal:true e o `aviso` para a tela. Só rejeita
 *     (Error com .codigo e .texto) quando o pedido é inválido.
 *
 * MODO NUVEM (banco do Artifact), conforme claude.d.ts e db.d.ts:
 *   - `await claude.use("db")`; `null`, exceção ou ausência de window.claude
 *     => modo local. Só `use` é lido de window.claude.
 *   - coleção `pedidos_<vertical>`, um documento por pedido, id = protocolo.
 *   - `onSnapshot` UMA vez por vertical, na primeira vez que a vertical é
 *     pedida (listar/aoMudar/salvar), nunca a partir de renderização.
 *   - um snapshot vazio vindo do cache (fromCache) é ignorado; só um vazio
 *     definitivo dispara a gravação do cenário, e só se for possível gravar.
 *   - uma gravação por documento por vez (fila por documento, sempre com o
 *     corpo mais recente) e só quando o documento mudou.
 *   - `unavailable` (ou código desconhecido): uma nova tentativa após uma
 *     espera curta e aleatória; qualquer outra recusa, erro do onSnapshot ou
 *     8 s sem snapshot => cai para o modo local sem quebrar.
 *
 * O QUE NÃO PÔDE SER TESTADO AQUI: o modo nuvem de verdade. `claude.use("db")`
 * só existe dentro do visualizador do claude.ai; no navegador local não há
 * window.claude e o store cai no modo local. Os testes (testes.html) exercitam
 * esta lógica contra um banco FALSO escrito a partir do db.d.ts (vazio,
 * snapshot do cache, recusa de gravação, erro de assinatura), mas não contra
 * a plataforma: latência real, regras de acesso, cotas (5.000 documentos),
 * limite de taxa, ordem e frequência reais dos snapshots e o comportamento
 * com dois aparelhos gravando ao mesmo tempo ficam para o teste no
 * visualizador. Limitação conhecida: dois aparelhos criando pedido no mesmo
 * instante podem gerar o mesmo protocolo (o último a gravar prevalece).
 *
 * MODO LOCAL: a memória é a fonte de verdade; localStorage é só espelho, com
 * try/catch em toda leitura e escrita (funciona mesmo se ele lançar erro).
 * Um cenário guardado de outro dia e nunca alterado é gerado de novo, para
 * as datas não envelhecerem.
 */
(function () {
  "use strict";
  var K = (window.Kayan = window.Kayan || {});

  var VERSAO_LOCAL = 3; // 2: protocolo VA-24815 e pedido com solicitante, dados e o_que_falta (rodada 4)
                        // 3: vencimentos com feriados (rodada 5); o espelho antigo é descartado
  var ESPERA_SNAPSHOT_MS = 8000;
  var RE_ID = /^[A-Za-z0-9_\-.~:@+]{1,200}$/;
  var CODIGOS_DB = ["invalid_argument", "resource_exhausted", "quota_exceeded", "unavailable", "revoked",
                    "not_granted", "capability_disabled", "capability_removed", "transform_error"];
  var APAGAR = { __apagar: true };

  function noop() {}

  function clonar(x) { return x == null ? x : JSON.parse(JSON.stringify(x)); }

  // JSON com chaves ordenadas: compara documentos sem depender da ordem.
  function canonico(x) {
    if (x === null || typeof x !== "object") return JSON.stringify(x === undefined ? null : x);
    if (Array.isArray(x)) return "[" + x.map(canonico).join(",") + "]";
    return "{" + Object.keys(x).sort().filter(function (k) { return x[k] !== undefined; })
      .map(function (k) { return JSON.stringify(k) + ":" + canonico(x[k]); }).join(",") + "}";
  }

  function esperar(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function codigoDe(e) {
    var c = e && typeof e.code === "string" ? e.code : null;
    return CODIGOS_DB.indexOf(c) >= 0 ? c : "unavailable"; // código desconhecido = unavailable
  }

  function reportar(e) {
    try { if (window.console && console.error) console.error("[Kayan.store]", e); } catch (_) { /* nada */ }
  }

  function erroKayan(codigo, texto) {
    var e = new Error(codigo);
    e.name = "ErroKayan";
    e.codigo = codigo;
    e.texto = texto;
    return e;
  }

  function textoErro(motivo) {
    return K.motor.preencher(K.motor.TEXTOS.erros.pedido_invalido, { motivo: motivo });
  }

  function pedidoValido(p, v) {
    return !!p && typeof p === "object" && p.vertical === v && typeof p.protocolo === "string" &&
      RE_ID.test(p.protocolo) && p.protocolo !== "." && p.protocolo !== ".." &&
      K.motor.ESTADOS.indexOf(p.estado) >= 0;
  }

  function colecao(v) { return "pedidos_" + v; }

  function mapa(pedidos) {
    var m = new Map();
    pedidos.forEach(function (p) { m.set(p.protocolo, clonar(p)); });
    return m;
  }

  function criarStore(opcoes) {
    opcoes = opcoes || {};
    var prefixoChave = opcoes.chave || "kayan_demo_v2_";
    var relogio = typeof opcoes.agora === "function" ? opcoes.agora : function () { return new Date(); };
    var esperaSnapshotMs = typeof opcoes.esperaSnapshotMs === "number" ? opcoes.esperaSnapshotMs : ESPERA_SNAPSHOT_MS;
    var claudeInjetado = Object.prototype.hasOwnProperty.call(opcoes, "claude");

    var st = {
      iniciando: null,
      modo: "local",
      podeGravar: false,
      db: null,
      motivoLocal: null,
      v: {},
      cbModo: null,
      diag: { assinaturas: {}, gravacoes: 0, apagamentos: 0, semeaduras: {}, falhas: [] }
    };

    // ---------------------------------------------------------- utilidades
    function obterClaude() {
      if (claudeInjetado) return opcoes.claude;
      try { return window.claude; } catch (e) { return undefined; }
    }

    function armazenamento() {
      try { return window.localStorage || null; } catch (e) { return null; }
    }

    // O localStorage aceita gravar? (modo privado, bloqueio ou cota cheia dizem que não)
    function espelhoOk() {
      try {
        var ls = armazenamento();
        if (!ls) return false;
        var k = prefixoChave + "__teste";
        ls.setItem(k, "1");
        ls.removeItem(k);
        return true;
      } catch (e) {
        return false;
      }
    }

    function registrarFalha(onde, e) {
      st.diag.falhas.push({ onde: onde, codigo: codigoDe(e), mensagem: String((e && e.message) || e) });
      if (st.diag.falhas.length > 20) st.diag.falhas.shift();
    }

    function resultado(modo, caiu, cod) {
      return { ok: true, modo: modo, caiuParaLocal: !!caiu, erro: cod || null,
               aviso: caiu ? K.motor.TEXTOS.store.falha_nuvem : null };
    }

    function estadoVertical(v) {
      if (!K.verticais || !K.verticais[v]) {
        throw erroKayan("vertical_inexistente",
          K.motor.preencher(K.motor.TEXTOS.erros.vertical_inexistente, { valor: v }));
      }
      if (!st.v[v]) {
        st.v[v] = {
          pedidos: new Map(), carregado: null, cb: null, unsub: null,
          nuvem: new Map(), pendentes: new Map(), filas: new Map(),
          alterado: false, geradoEm: null, decidiuSemente: false,
          aoFallback: null, notificacaoAgendada: false
        };
      }
      return st.v[v];
    }

    function lista(s) {
      return Array.from(s.pedidos.values()).map(clonar).sort(function (a, b) {
        return a.protocolo < b.protocolo ? -1 : a.protocolo > b.protocolo ? 1 : 0;
      });
    }

    function notificar(v, s) {
      if (!s.cb || s.notificacaoAgendada) return;
      s.notificacaoAgendada = true;
      Promise.resolve().then(function () {
        s.notificacaoAgendada = false;
        if (!s.cb) return;
        try { s.cb(lista(s)); } catch (e) { reportar(e); }
      });
    }

    function avisarModo() {
      setTimeout(function () {
        if (!st.cbModo) return;
        try { st.cbModo(st.modo, st.motivoLocal); } catch (e) { reportar(e); }
      }, 0);
    }

    // ---------------------------------------------------------- modo local
    function lerLocal(v) {
      try {
        var ls = armazenamento();
        if (!ls) return null;
        var bruto = ls.getItem(prefixoChave + v);
        if (!bruto) return null;
        var reg = JSON.parse(bruto);
        if (!reg || reg.versao !== VERSAO_LOCAL || !Array.isArray(reg.pedidos)) return null;
        return reg;
      } catch (e) {
        return null;
      }
    }

    function espelhar(v, s) {
      try {
        var ls = armazenamento();
        if (!ls) return false;
        ls.setItem(prefixoChave + v, JSON.stringify({
          versao: VERSAO_LOCAL, gerado_em: s.geradoEm, alterado: s.alterado, pedidos: lista(s)
        }));
        return true;
      } catch (e) {
        return false;
      }
    }

    function carregarLocal(v, s) {
      var agora = relogio();
      var reg = lerLocal(v);
      var validos = reg ? reg.pedidos.filter(function (p) { return pedidoValido(p, v); }) : [];
      var gerado = reg && reg.gerado_em ? new Date(reg.gerado_em) : null;
      var mesmoDia = gerado && !isNaN(gerado.getTime()) && K.motor.mesmoDia(gerado, agora);
      if (validos.length > 0 && (reg.alterado || mesmoDia)) {
        s.pedidos = mapa(validos);
        s.alterado = !!reg.alterado;
        s.geradoEm = reg.gerado_em;
      } else {
        s.pedidos = mapa(K.cenario.gerar(v, agora));
        s.alterado = false;
        s.geradoEm = agora.toISOString();
        espelhar(v, s);
      }
    }

    function cairParaLocal(codigo) {
      if (st.modo === "local") return;
      st.modo = "local";
      st.podeGravar = false;
      st.motivoLocal = codigo || "unavailable";
      Object.keys(st.v).forEach(function (v) {
        var s = st.v[v];
        if (s.unsub) { try { s.unsub(); } catch (e) { /* nada */ } s.unsub = null; }
        s.pendentes.clear();
        if (s.pedidos.size > 0) {
          if (!s.geradoEm) s.geradoEm = relogio().toISOString();
          espelhar(v, s);
        }
        if (s.aoFallback) s.aoFallback();
      });
      avisarModo();
    }

    // ---------------------------------------------------------- modo nuvem
    function definitivo(snap) { return !(snap && snap.metadata && snap.metadata.fromCache); }

    function carregarNuvem(v, s) {
      return new Promise(function (resolve) {
        var pronto = false, timer = null;
        function terminar() {
          if (pronto) return;
          pronto = true;
          if (timer) clearTimeout(timer);
          s.aoFallback = null;
          resolve();
        }
        s.aoFallback = function () {
          if (s.pedidos.size === 0) carregarLocal(v, s);
          terminar();
        };
        timer = setTimeout(function () { cairParaLocal("sem_snapshot"); terminar(); }, esperaSnapshotMs);
        try {
          var col = st.db.collection(colecao(v));
          st.diag.assinaturas[v] = (st.diag.assinaturas[v] || 0) + 1;
          s.unsub = col.onSnapshot(function (snap) {
            try { aoSnapshot(v, s, snap); } catch (e) { reportar(e); }
            if (!pronto && st.modo === "nuvem" && (s.pedidos.size > 0 || definitivo(snap))) terminar();
          }, function (err) {
            registrarFalha("onSnapshot", err);
            cairParaLocal(codigoDe(err));
            terminar();
          });
        } catch (e) {
          registrarFalha("onSnapshot", e);
          cairParaLocal(codigoDe(e));
          terminar();
        }
      });
    }

    function aoSnapshot(v, s, snap) {
      if (st.modo !== "nuvem") return;
      var def = definitivo(snap);
      var docs = (snap && snap.docs) || [];
      if (docs.length === 0 && !def) return; // vazio do cache: espera o definitivo

      var nuvem = new Map(), novo = new Map();
      docs.forEach(function (d) {
        if (!d || d.exists === false || typeof d.data !== "function") return;
        var dados = clonar(d.data());
        if (!pedidoValido(dados, v)) return;
        nuvem.set(d.id, canonico(dados));
        novo.set(d.id, dados);
      });
      s.nuvem = nuvem;

      if (docs.length === 0 && def && !s.decidiuSemente) {
        s.decidiuSemente = true;
        if (st.podeGravar) { semear(v, s); return; }
      }
      if (def) s.decidiuSemente = true;

      s.pendentes.forEach(function (corpo, id) {
        if (corpo === APAGAR) novo.delete(id); else novo.set(id, clonar(corpo));
      });
      s.pedidos = novo;
      notificar(v, s);
    }

    function semear(v, s) {
      var agora = relogio();
      s.pedidos = mapa(K.cenario.gerar(v, agora));
      s.geradoEm = agora.toISOString();
      st.diag.semeaduras[v] = (st.diag.semeaduras[v] || 0) + 1;
      var itens = lista(s);
      itens.forEach(function (p) { s.pendentes.set(p.protocolo, p); });
      notificar(v, s);
      (async function () {
        for (var i = 0; i < itens.length; i++) {
          var r = await gravar(v, s, itens[i].protocolo, itens[i]);
          if (r.caiuParaLocal) break;
        }
      })().catch(reportar);
    }

    async function comUmaRetentativa(fn) {
      try {
        return await fn();
      } catch (e) {
        if (codigoDe(e) !== "unavailable") throw e;
        await esperar(250 + Math.floor(Math.random() * 500));
        return await fn();
      }
    }

    // Fila por documento: uma gravação por vez, sempre com o corpo mais recente.
    function gravar(v, s, id, corpo) {
      s.pendentes.set(id, corpo);
      var anterior = s.filas.get(id) || Promise.resolve();
      var atual = anterior.then(function () { return executarGravacao(v, s, id); });
      s.filas.set(id, atual.then(noop, noop));
      return atual;
    }

    async function executarGravacao(v, s, id) {
      if (st.modo !== "nuvem" || !st.podeGravar) return resultado("local", true, st.motivoLocal);
      if (!s.pendentes.has(id)) return resultado("nuvem", false, null); // já gravado por uma rodada anterior
      var corpo = s.pendentes.get(id);
      var json = corpo === APAGAR ? null : canonico(corpo);
      var naNuvem = s.nuvem.has(id) ? s.nuvem.get(id) : null;
      if (json === naNuvem) { // nada mudou: não grava
        if (s.pendentes.get(id) === corpo) s.pendentes.delete(id);
        return resultado("nuvem", false, null);
      }
      try {
        var ref = st.db.collection(colecao(v)).doc(id);
        await comUmaRetentativa(function () { return corpo === APAGAR ? ref.delete() : ref.set(JSON.parse(json)); });
        if (corpo === APAGAR) { s.nuvem.delete(id); st.diag.apagamentos++; }
        else { s.nuvem.set(id, json); st.diag.gravacoes++; }
        if (s.pendentes.get(id) === corpo) s.pendentes.delete(id);
        return resultado("nuvem", false, null);
      } catch (e) {
        registrarFalha("gravacao", e);
        var cod = codigoDe(e);
        cairParaLocal(cod);
        return resultado("local", true, cod);
      }
    }

    // ---------------------------------------------------------- ciclo de vida
    function iniciar() {
      if (st.iniciando) return st.iniciando;
      st.iniciando = (async function () {
        var c = obterClaude(), db = null;
        if (c && typeof c.use === "function") {
          try { db = await c.use("db"); } catch (e) { db = null; st.motivoLocal = "use_falhou"; }
        } else {
          st.motivoLocal = "sem_claude";
        }
        if (db && typeof db.collection === "function") {
          st.db = db; st.modo = "nuvem"; st.podeGravar = true; st.motivoLocal = null;
        } else {
          st.modo = "local"; st.podeGravar = false;
          if (!st.motivoLocal) st.motivoLocal = "db_indisponivel";
        }
        avisarModo();
        return st.modo;
      })();
      return st.iniciando;
    }

    async function garantir(v) {
      var s = estadoVertical(v);
      await iniciar();
      if (!s.carregado) {
        s.carregado = st.modo === "nuvem" ? carregarNuvem(v, s)
          : Promise.resolve().then(function () { carregarLocal(v, s); notificar(v, s); });
      }
      await s.carregado;
      return s;
    }

    // Síncrono até a gravação: a memória muda antes de qualquer await.
    function salvarInterno(v, s, copia) {
      copia.id = copia.protocolo;
      s.pedidos.set(copia.protocolo, copia);
      s.alterado = true;
      notificar(v, s);
      if (st.modo === "nuvem") {
        return gravar(v, s, copia.protocolo, copia).then(function (r) { r.pedido = clonar(copia); return r; });
      }
      espelhar(v, s);
      var r = resultado("local", false, null);
      r.pedido = clonar(copia);
      return Promise.resolve(r);
    }

    // ---------------------------------------------------------- API
    var api = {
      iniciar: iniciar,

      modo: function () { return st.modo; },

      podeGravarNaNuvem: function () { return st.modo === "nuvem" && st.podeGravar; },

      rotuloModo: function () {
        if (st.modo === "nuvem") return K.motor.TEXTOS.store.nuvem;
        return K.motor.TEXTOS.store[espelhoOk() ? "local" : "local_sem_espelho"];
      },

      espelhoDisponivel: function () { return espelhoOk(); },

      listar: async function (v) {
        var s = await garantir(v);
        return lista(s);
      },

      salvar: async function (pedido) {
        if (!pedido || typeof pedido !== "object") throw erroKayan("pedido_invalido", textoErro("objeto ausente"));
        var v = pedido.vertical;
        estadoVertical(v);
        if (!pedidoValido(pedido, v)) throw erroKayan("pedido_invalido", textoErro("protocolo ou estado inválido"));
        var s = await garantir(v);
        return salvarInterno(v, s, clonar(pedido));
      },

      criarPedido: async function (v, dados) {
        var s = await garantir(v);
        var existentes = Array.from(s.pedidos.values());
        var existente = K.motor.idempotencia(dados && dados.evento_externo_id, existentes);
        if (existente) {
          var r0 = resultado(st.modo, false, null);
          r0.pedido = clonar(existente);
          r0.duplicado = true;
          return r0;
        }
        var p = K.motor.criarPedido(dados, v, relogio(), existentes); // lança erro de validação
        var r = await salvarInterno(v, s, p);
        r.duplicado = false;
        return r;
      },

      restaurar: async function (v) {
        var s = await garantir(v);
        var agora = relogio();
        var novos = K.cenario.gerar(v, agora);
        var antigos = Array.from(new Set(Array.from(s.pedidos.keys()).concat(Array.from(s.nuvem.keys()))));
        s.pedidos = mapa(novos);
        s.alterado = false;
        s.geradoEm = agora.toISOString();
        notificar(v, s);

        function fim(r) { r.pedidos = lista(s); return r; }
        if (st.modo !== "nuvem") { espelhar(v, s); return fim(resultado("local", false, null)); }

        var idsNovos = {};
        novos.forEach(function (p) { idsNovos[p.protocolo] = true; });
        var apagar = antigos.filter(function (id) { return !idsNovos[id]; });
        apagar.forEach(function (id) { s.pendentes.set(id, APAGAR); });
        novos.forEach(function (p) { s.pendentes.set(p.protocolo, p); });
        for (var i = 0; i < apagar.length; i++) {
          var r1 = await gravar(v, s, apagar[i], APAGAR);
          if (r1.caiuParaLocal) return fim(r1);
        }
        for (var j = 0; j < novos.length; j++) {
          var r2 = await gravar(v, s, novos[j].protocolo, novos[j]);
          if (r2.caiuParaLocal) return fim(r2);
        }
        return fim(resultado("nuvem", false, null));
      },

      aoMudar: function (v, cb) {
        var s = estadoVertical(v);
        s.cb = typeof cb === "function" ? cb : null;
        garantir(v).catch(reportar);
        return function cancelar() { if (s.cb === cb) s.cb = null; };
      },

      aoMudarModo: function (cb) {
        st.cbModo = typeof cb === "function" ? cb : null;
        return function cancelar() { if (st.cbModo === cb) st.cbModo = null; };
      },

      diagnostico: function () {
        var verticais = {};
        Object.keys(st.v).forEach(function (v) {
          var s = st.v[v];
          verticais[v] = { pedidos: s.pedidos.size, pendentes: s.pendentes.size, assinada: !!s.unsub, alterado: s.alterado };
        });
        return {
          modo: st.modo, podeGravar: st.podeGravar, motivoLocal: st.motivoLocal,
          assinaturas: clonar(st.diag.assinaturas), gravacoes: st.diag.gravacoes,
          apagamentos: st.diag.apagamentos, semeaduras: clonar(st.diag.semeaduras),
          falhas: clonar(st.diag.falhas), verticais: verticais
        };
      }
    };
    return api;
  }

  K.criarStore = criarStore;
  K.store = criarStore();
})();
</script>
<script>
/* ---- src/ia_simulada.js ---- */
/*
 * Kayan · demo web — simulação do atendimento automático.
 *
 * DEV-MOTOR escreveu a primeira versão; o DEV-UI (rodada 4) acrescentou o que
 * a tela do protótipo precisa: roteiros do COPY_DECK, "digitando", pausa e
 * continuação da simulação inteira, portões humanos (assumir a conversa e
 * enviar a mensagem sugerida), pedido aberto pela atendente depois da
 * passagem e "Devolver para a IA".
 *
 * Não há modelo de linguagem aqui: são roteiros fixos (verticais.js, campo
 * `ia.conversas`) tocados em paralelo. A tela deve mostrar sempre
 * TEXTOS.ia.rotulo ("Simulação do atendimento automático").
 *
 * API:
 *   const sessao = Kayan.iaSimulada.iniciar(vertical, aoEvento, opcoes?)
 *     opcoes: { ritmoMs = 1400, store = Kayan.store, agora = () => new Date() }
 *       ritmoMs 1400 = ritmo do protótipo; 0 = instantâneo (testes).
 *     -> { id, vertical, rotulo, conversas: [...], terminou: Promise<resumo>, parar() }
 *     `terminou` resolve quando toda conversa acabou ou espera uma pessoa.
 *     Iniciar de novo a mesma vertical encerra a sessão anterior dela.
 *   Kayan.iaSimulada.pausar(conversaId)                  -> bool (a IA para naquela conversa)
 *   await Kayan.iaSimulada.assumir(conversaId, atendente) -> { ok, conversa }
 *   Kayan.iaSimulada.responder(conversaId, texto, atendente?) -> bool
 *   Kayan.iaSimulada.devolver(conversaId)                -> bool ("Devolver para a IA")
 *   Kayan.iaSimulada.pausarSimulacao(vertical) / continuarSimulacao(vertical) -> bool
 *   Kayan.iaSimulada.estado(vertical)                    -> { iniciada, pausada, terminada } | null
 *   Kayan.iaSimulada.conversas(vertical)                 -> estado atual das conversas
 *   Kayan.iaSimulada.parar(vertical?)                    -> encerra uma ou todas
 *
 * Eventos entregues a aoEvento(evento):
 *   { tipo: "mensagem" | "pedido_aberto" | "passou_para_humano" | "resolvido" |
 *           "digitando" | "aguardando_atendente" | "conversa_terminada",
 *     conversaId, vertical, em, simulacao: true, conversa: {...},
 *     autor?: "solicitante" | "ia" | "atendente" | "sistema", texto?, tom?,
 *     pedido?, por?: "ia" | "atendente", motivo?, ativo?, acao? }
 *
 * Os pedidos abertos entram de verdade na fila, pelo Kayan.store.criarPedido
 * (mesmo caminho do registro, com protocolo sequencial e idempotência pelo
 * evento_externo_id).
 */
(function () {
  "use strict";
  var K = (window.Kayan = window.Kayan || {});

  var RITMO_PADRAO_MS = 1400;
  var ESPERA_PADRAO = 1400;   // pausa antes de um passo sem `espera`, no ritmo 1000
  var DIGITACAO = 1100;       // tempo do "A IA está digitando"
  var ESCALONAMENTO = 900;    // defasagem entre as conversas no segundo passo
  var registro = {};          // conversaId -> conversa
  var sessoes = {};           // vertical -> sessão ativa
  var contador = 0;

  function T() { return K.motor.TEXTOS; }

  function reportar(e) {
    try { if (window.console && console.error) console.error("[Kayan.iaSimulada]", e); } catch (_) { /* nada */ }
  }

  function publico(c) {
    return {
      id: c.id, vertical: c.vertical, chave: c.chave, titulo: c.assunto, assunto: c.assunto,
      solicitante: K.motor.clonar(c.solicitante), solicitante_rotulo: c.solicitante.nome,
      estado: c.estado,
      rotulo_estado: T().ia.estados_conversa[c.estado] || c.estado,
      atendente: c.atendente, motivo: c.motivo,
      protocolo: c.pedido ? c.pedido.protocolo : null,
      protocolos: c.protocolos.slice(),
      aguardando: c.portao ? c.portao.tipo : null,
      rascunho: c.rascunho,
      digitando: c.digitando,
      terminada: c.terminada,
      mensagens: c.mensagens.map(function (m) {
        return { em: m.em, autor: m.autor, texto: m.texto, tom: m.tom || null, anexo: m.anexo || null };
      })
    };
  }

  function emitir(sessao, conv, evento) {
    evento.conversaId = conv.id;
    evento.vertical = conv.vertical;
    evento.em = sessao.relogio().toISOString();
    evento.simulacao = true;
    if (evento.tipo === "mensagem") {
      conv.mensagens.push({ em: evento.em, autor: evento.autor, texto: evento.texto, tom: evento.tom || null, anexo: evento.anexo || null });
    }
    evento.conversa = publico(conv);
    if (typeof sessao.aoEvento === "function") {
      try { sessao.aoEvento(evento); } catch (e) { reportar(e); }
    }
  }

  function mensagem(sessao, conv, autor, texto, extra) {
    var ev = { tipo: "mensagem", autor: autor, texto: texto };
    if (extra) Object.keys(extra).forEach(function (k) { if (extra[k] != null) ev[k] = extra[k]; });
    emitir(sessao, conv, ev);
  }

  function cfgDe(vertical) { return K.verticais && K.verticais[vertical]; }

  function variaveis(sessao, conv, passo) {
    var agora = sessao.relogio(), M = K.motor;
    var cfg = cfgDe(conv.vertical);
    var pedido = conv.pedido;
    var tipoId = (passo && passo.tipo_id) || (pedido && pedido.tipo_id);
    var tipo = tipoId ? M.tipo(conv.vertical, tipoId) : null;
    var vars = {
      nome: conv.solicitante.curto || String(conv.solicitante.nome || "").split(/\s+/)[0],
      atendente: conv.atendente || cfg.atendente.nome,
      motivo: conv.motivo,
      // hora local do momento da mensagem (o relógio da sessão, fixável nos testes)
      saudacao: M.saudacao(agora),
      saudacao_despedida: M.saudacao(agora)
    };
    if (tipo) {
      vars.Tipo = tipo.nome;
      vars.tipo = M.minusculaInicial(tipo.nome);
      vars.prazo_tipo = M.rotuloPrazo(tipo.prazo);
    }
    if (pedido) {
      var unidade = M.unidadeDoPedido(pedido);
      var ptipo = M.tipo(pedido.vertical, pedido.tipo_id);
      vars.protocolo = pedido.protocolo;
      if (ptipo && !(passo && passo.tipo_id)) { vars.Tipo = ptipo.nome; vars.tipo = M.minusculaInicial(ptipo.nome); }
      vars.vencimento_longo = M.formatarAte(pedido.vencimento, unidade, agora, false);
      vars.vencimento_curto = M.formatarAte(pedido.vencimento, unidade, agora, true);
      vars.vencimento = vars.vencimento_longo;
      vars.estado = M.rotuloEstadoPedido(pedido);
      vars.estado_voz = M.vozEstado(pedido);
      vars.prazo_voz = M.vozPrazo(pedido, agora);
      vars.responsavel = pedido.responsavel || "";
      vars.com_responsavel = pedido.responsavel ? M.preencher(T().ia.com_responsavel, { responsavel: pedido.responsavel }) : "";
    }
    return vars;
  }

  function texto(sessao, conv, passo, modelo) {
    return K.motor.preencher(modelo, variaveis(sessao, conv, passo));
  }

  // --------------------------------------------------------------- portões
  function marcarOcioso(conv) {
    if (conv.ocioso) { var r = conv.ocioso; conv.ocioso = null; r(); }
  }

  function portao(sessao, conv, tipo) {
    return new Promise(function (resolve) {
      if (!sessao.ativa) return resolve(null);
      conv.portao = { tipo: tipo, resolve: resolve };
      marcarOcioso(conv);
      emitir(sessao, conv, { tipo: "aguardando_atendente", acao: tipo });
    });
  }

  function abrirPortao(conv, tipo, valor) {
    if (!conv.portao || (tipo && conv.portao.tipo !== tipo)) return false;
    var p = conv.portao;
    conv.portao = null;
    p.resolve(valor === undefined ? true : valor);
    return true;
  }

  function terminar(sessao, conv) {
    if (conv.terminada) return;
    conv.terminada = true;
    conv.digitando = false;
    marcarOcioso(conv);
    if (sessao.ativa) emitir(sessao, conv, { tipo: "conversa_terminada" });
  }

  // A IA não fala quando uma pessoa está atendendo, nem depois de pausada.
  function podeExecutar(conv, passo) {
    if (conv.estado === "pausada") return false;
    var daIa = passo.de === "ia" || passo.acao === "resolver" || passo.acao === "consultar" ||
      passo.acao === "passar_para_humano" || (passo.acao === "abrir_pedido" && passo.por !== "atendente");
    if (daIa && (conv.estado === "humano" || conv.estado === "aguardando_humano")) return false;
    return true;
  }

  function passarParaHumano(sessao, conv, motivo) {
    conv.estado = "aguardando_humano";
    conv.motivo = motivo || null;
    mensagem(sessao, conv, "sistema", K.motor.preencher(T().ia.passou, { motivo: conv.motivo || "" }), { tom: "passou" });
    emitir(sessao, conv, { tipo: "passou_para_humano", motivo: conv.motivo, pedido: conv.pedido ? K.motor.clonar(conv.pedido) : null });
  }

  async function abrirPedido(sessao, conv, passo) {
    var M = K.motor, cfg = cfgDe(conv.vertical);
    var porAtendente = passo.por === "atendente";
    var nome = conv.atendente || cfg.atendente.nome;
    var dados = {
      tipo_id: passo.tipo_id,
      canal: "whatsapp",
      solicitante: conv.solicitante,
      descricao: passo.descricao,
      dados: passo.dados || [],
      atendimento_ia: porAtendente ? "passou_para_humano" : (passo.atendimento_ia || "resolveu_sozinha"),
      motivo_ia: porAtendente ? conv.motivo : (passo.motivo || null),
      evento_externo_id: sessao.id + ":" + conv.chave + (porAtendente ? ":atendente" : ""),
      novo: true
    };
    if (porAtendente) { dados.responsavel = nome; dados.aberto_por = nome; dados.autor = nome; }
    var r = await sessao.store.criarPedido(conv.vertical, dados);
    var pedido = r.pedido;
    if (porAtendente && passo.estado && passo.estado !== "recebido" && !r.duplicado) {
      var t = M.aplicarTransicao(pedido, passo.estado, nome, sessao.relogio(), null);
      var r2 = await sessao.store.salvar(t.pedido);
      pedido = r2.pedido || t.pedido;
    }
    conv.pedido = pedido;
    if (conv.protocolos.indexOf(pedido.protocolo) < 0) conv.protocolos.push(pedido.protocolo);
    conv.pedidoAbertoPelaSessao = true;
    if (!porAtendente && conv.estado !== "humano") conv.estado = "pedido_aberto";
    emitir(sessao, conv, { tipo: "pedido_aberto", pedido: M.clonar(pedido), por: porAtendente ? "atendente" : "ia",
                           duplicado: !!r.duplicado, caiuParaLocal: !!r.caiuParaLocal });
  }

  async function rodarConversa(sessao, conv, roteiro, indice) {
    var escala = function (ms) { return Math.round(ms * sessao.ritmo / 1000); };
    await sessao.esperar(0); // deixa pausar() agir antes da primeira mensagem
    for (var i = 0; i < roteiro.passos.length; i++) {
      if (!sessao.ativa) return terminar(sessao, conv);
      var passo = roteiro.passos[i];
      if (!podeExecutar(conv, passo)) return terminar(sessao, conv);

      if (passo.de === "atendente") {
        conv.rascunho = texto(sessao, conv, passo, passo.texto);
        var ok = await portao(sessao, conv, "enviar");
        if (!sessao.ativa || !ok) return terminar(sessao, conv);
        continue; // a mensagem saiu por responder()
      }

      if (i > 0) {
        var espera = passo.espera != null ? passo.espera : ESPERA_PADRAO;
        if (i === 1) espera += indice * ESCALONAMENTO;
        await sessao.esperar(escala(espera));
        if (!sessao.ativa) return terminar(sessao, conv);
        if (!podeExecutar(conv, passo)) return terminar(sessao, conv);
      }

      try {
        if (passo.de === "ia") {
          conv.digitando = true;
          emitir(sessao, conv, { tipo: "digitando", ativo: true });
          await sessao.esperar(escala(DIGITACAO));
          conv.digitando = false;
          if (!sessao.ativa || !podeExecutar(conv, passo)) {
            if (sessao.ativa) emitir(sessao, conv, { tipo: "digitando", ativo: false });
            return terminar(sessao, conv);
          }
          if (conv.estado === "nova" || conv.estado === "devolvida") conv.estado = "bot";
          mensagem(sessao, conv, "ia", texto(sessao, conv, passo, passo.texto));
          continue;
        }
        if (passo.de === "solicitante") {
          mensagem(sessao, conv, "solicitante", texto(sessao, conv, passo, passo.texto), { anexo: passo.anexo || null });
          continue;
        }
        if (passo.de === "sistema") {
          mensagem(sessao, conv, "sistema", texto(sessao, conv, passo, passo.texto), { tom: passo.tom || null });
          continue;
        }
        if (passo.acao === "abrir_pedido") {
          try {
            await abrirPedido(sessao, conv, passo);
          } catch (e) {
            reportar(e);
            if (!sessao.ativa) return terminar(sessao, conv);
            mensagem(sessao, conv, "ia", T().ia.falha_registro);
            passarParaHumano(sessao, conv, T().ia.motivo_falha_registro);
            await portao(sessao, conv, "assumir");
            return terminar(sessao, conv);
          }
          continue;
        }
        if (passo.acao === "consultar") {
          var lista = await sessao.store.listar(conv.vertical);
          if (!sessao.ativa) return terminar(sessao, conv);
          var achado = null;
          for (var j = 0; j < lista.length; j++) {
            if (passo.protocolo ? lista[j].protocolo === passo.protocolo
                : (lista[j].tipo_id === passo.tipo_id && lista[j].solicitante_rotulo === conv.solicitante.nome)) achado = lista[j];
          }
          if (!achado) {
            mensagem(sessao, conv, "ia", texto(sessao, conv, passo, passo.nao_encontrado || T().ia.falha_registro));
            passarParaHumano(sessao, conv, passo.motivo_nao_encontrado || null);
            var okN = await portao(sessao, conv, "assumir");
            if (!sessao.ativa || !okN) return terminar(sessao, conv);
            return terminar(sessao, conv);
          }
          conv.pedido = achado;
          continue;
        }
        if (passo.acao === "passar_para_humano") {
          passarParaHumano(sessao, conv, passo.motivo);
          var okA = await portao(sessao, conv, "assumir");
          if (!sessao.ativa || !okA) return terminar(sessao, conv);
          continue;
        }
        if (passo.acao === "resolver") {
          conv.estado = "resolvida";
          mensagem(sessao, conv, "sistema", T().ia.resolvida, { tom: "resolvida" });
          emitir(sessao, conv, { tipo: "resolvido", pedido: conv.pedido ? K.motor.clonar(conv.pedido) : null });
          continue;
        }
      } catch (e) {
        reportar(e);
        return terminar(sessao, conv);
      }
    }
    terminar(sessao, conv);
  }

  function resumo(sessao) {
    var r = { sessaoId: sessao.id, vertical: sessao.vertical, pedidosAbertos: [], passouParaHumano: 0, resolvidas: 0,
              conversas: sessao.conversas.map(publico) };
    sessao.conversas.forEach(function (c) {
      if (c.pedidoAbertoPelaSessao) c.protocolos.forEach(function (p) { r.pedidosAbertos.push(p); });
      if (c.motivo || c.estado === "aguardando_humano") r.passouParaHumano++;
      if (c.estado === "resolvida") r.resolvidas++;
    });
    return r;
  }

  // ------------------------------------------------ temporizadores pausáveis
  function criarRelogioDePassos(sessao) {
    function agendar(t) {
      if (sessao.pausada || !sessao.ativa) return;
      t.inicio = Date.now();
      t.id = setTimeout(function () { sessao.timers.delete(t); t.resolve(); }, t.restante);
    }
    sessao.esperar = function (ms) {
      return new Promise(function (resolve) {
        if (!sessao.ativa) return resolve();
        var t = { restante: Math.max(0, ms), resolve: resolve, id: null, inicio: 0 };
        sessao.timers.add(t);
        agendar(t);
      });
    };
    sessao.pausarTimers = function () {
      sessao.timers.forEach(function (t) {
        if (t.id !== null) { clearTimeout(t.id); t.id = null; t.restante = Math.max(0, t.restante - (Date.now() - t.inicio)); }
      });
    };
    sessao.retomarTimers = function () { sessao.timers.forEach(function (t) { if (t.id === null) agendar(t); }); };
  }

  function pararSessao(sessao) {
    if (!sessao.ativa) return;
    sessao.ativa = false;
    sessao.timers.forEach(function (t) { if (t.id !== null) clearTimeout(t.id); t.resolve(); });
    sessao.timers.clear();
    sessao.conversas.forEach(function (c) {
      if (c.portao) { var p = c.portao; c.portao = null; p.resolve(null); }
      marcarOcioso(c);
    });
    if (sessoes[sessao.vertical] === sessao) delete sessoes[sessao.vertical];
  }

  function iniciar(vertical, aoEvento, opcoes) {
    var cfg = cfgDe(vertical);
    if (!cfg) {
      var e = new Error("vertical_inexistente");
      e.codigo = "vertical_inexistente";
      e.texto = K.motor.preencher(T().erros.vertical_inexistente, { valor: vertical });
      throw e;
    }
    opcoes = opcoes || {};
    if (sessoes[vertical]) {
      var anterior = sessoes[vertical];
      pararSessao(anterior);
      anterior.conversas.forEach(function (c) { delete registro[c.id]; });
    }
    contador++;
    var sessao = {
      id: "ia-" + vertical + "-" + Date.now().toString(36) + "-" + contador,
      vertical: vertical,
      aoEvento: null,
      store: opcoes.store || K.store,
      relogio: typeof opcoes.agora === "function" ? opcoes.agora : function () { return new Date(); },
      ritmo: typeof opcoes.ritmoMs === "number" ? Math.max(0, opcoes.ritmoMs) : RITMO_PADRAO_MS,
      ativa: true,
      pausada: false,
      timers: new Set(),
      conversas: []
    };
    criarRelogioDePassos(sessao);
    sessao.conversas = cfg.ia.conversas.map(function (roteiro, i) {
      var conv = {
        id: sessao.id + "-" + (i + 1), vertical: vertical, chave: roteiro.chave, assunto: roteiro.assunto,
        solicitante: K.motor.clonar(roteiro.solicitante), estado: "nova", atendente: null, pedido: null,
        protocolos: [], pedidoAbertoPelaSessao: false, motivo: null, mensagens: [], portao: null,
        rascunho: null, digitando: false, terminada: false, ocioso: null, sessao: sessao
      };
      registro[conv.id] = conv;
      return conv;
    });
    sessoes[vertical] = sessao;
    sessao.aoEvento = function (ev) { if (typeof aoEvento === "function") aoEvento(ev); };

    var ociosas = sessao.conversas.map(function (conv) {
      return new Promise(function (resolve) { conv.ocioso = resolve; });
    });
    sessao.conversas.forEach(function (conv, i) {
      rodarConversa(sessao, conv, cfg.ia.conversas[i], i).catch(function (err) { reportar(err); terminar(sessao, conv); });
    });
    var terminou = Promise.all(ociosas).then(function () { return resumo(sessao); });

    return {
      id: sessao.id,
      vertical: vertical,
      rotulo: T().ia.rotulo,
      conversas: sessao.conversas.map(publico),
      terminou: terminou,
      parar: function () { pararSessao(sessao); }
    };
  }

  function pausar(conversaId) {
    var conv = registro[conversaId];
    if (!conv) return false;
    if (conv.estado === "nova" || conv.estado === "bot" || conv.estado === "pedido_aberto" || conv.estado === "devolvida") {
      conv.estado = "pausada";
      mensagem(conv.sessao, conv, "sistema", T().ia.pausado, { tom: "neutro" });
    }
    return true;
  }

  async function assumir(conversaId, atendente) {
    var conv = registro[conversaId];
    if (!conv) return { ok: false, conversa: null };
    var sessao = conv.sessao;
    var nome = atendente || cfgDe(conv.vertical).atendente.nome;
    conv.estado = "humano";
    conv.atendente = nome;
    mensagem(sessao, conv, "sistema", K.motor.preencher(T().ia.assumiu, { atendente: nome }), { tom: "assumiu" });
    abrirPortao(conv, "assumir", true);
    if (conv.pedido) {
      try {
        var lista = await sessao.store.listar(conv.vertical);
        var atual = null;
        for (var i = 0; i < lista.length; i++) if (lista[i].protocolo === conv.pedido.protocolo) atual = lista[i];
        if (atual && atual.estado !== "concluido" && atual.responsavel !== nome && conv.pedidoAbertoPelaSessao) {
          var r = K.motor.atribuirResponsavel(atual, nome, nome, sessao.relogio(), null);
          await sessao.store.salvar(r.pedido);
          conv.pedido = r.pedido;
        }
      } catch (e) {
        reportar(e);
      }
    }
    return { ok: true, conversa: publico(conv) };
  }

  function responder(conversaId, texto, atendente) {
    var conv = registro[conversaId];
    if (!conv || typeof texto !== "string" || !texto.trim()) return false;
    if (conv.estado !== "humano") { conv.estado = "humano"; }
    if (atendente) conv.atendente = atendente;
    conv.rascunho = null;
    mensagem(conv.sessao, conv, "atendente", texto.trim());
    abrirPortao(conv, "enviar", true);
    return true;
  }

  function devolver(conversaId) {
    var conv = registro[conversaId];
    if (!conv || conv.estado !== "humano" || conv.portao) return false;
    conv.estado = "devolvida";
    mensagem(conv.sessao, conv, "sistema", T().ia.devolvida, { tom: "devolvida" });
    return true;
  }

  function pausarSimulacao(vertical) {
    var s = sessoes[vertical];
    if (!s || s.pausada) return false;
    s.pausada = true;
    s.pausarTimers();
    return true;
  }

  function continuarSimulacao(vertical) {
    var s = sessoes[vertical];
    if (!s || !s.pausada) return false;
    s.pausada = false;
    s.retomarTimers();
    return true;
  }

  function estado(vertical) {
    var s = sessoes[vertical];
    if (!s) return null;
    return { iniciada: true, pausada: s.pausada, terminada: s.conversas.every(function (c) { return c.terminada; }) };
  }

  function conversas(vertical) {
    var s = sessoes[vertical];
    return s ? s.conversas.map(publico) : [];
  }

  function parar(vertical) {

  };

      team: c.responsaveis, meta: c.meta_primeira_resposta,

  });

  /* ---------------------------------------------------------- datas */
  const agora = () => new Date();
  const D = x => (x instanceof Date ? x : new Date(x));
  const pad = n => String(n).padStart(2, '0');
  const fD = d => M.formatarDiaMes(d);
  const fLong = d => M.formatarDiaLongo(d);

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const firstOf = n => String(n || '').split(' ')[0];

  const chLabel = (v, ch) => M.rotuloCanal(v.vid, ch);

  const quem = p => M.solicitanteDe(p);
  const papel = (v, who) => M.nomePapel(who, v.vid);

  // armazenamento leve do aparelho (só conveniências: pedidos já vistos, conversas simuladas)

  function lerLS(k, padrao) { try { const x = window.localStorage.getItem(LS + k); return x ? JSON.parse(x) : padrao; } catch (e) { return padrao; } }

              ritmo: 1400, vistos: new Set(lerLS('vistos', [])) };
  const lista = v => S.data[v.key] || [];
  const findReq = (v, p) => lista(v).find(r => r.protocolo === p);
  const openReqs = v => lista(v).filter(r => r.estado !== 'concluido');
  const logIA = v => (S.iaLog[v.key] || (S.iaLog[v.key] = lerLS('ia_' + v.vid, [])));
  S.iaLog = {};

  async function carregar(v) {
    if (S.ready[v.key]) return;
    if (!S.loading[v.key]) {
      S.loading[v.key] = (async () => {
        await K.store.iniciar();
        const l = await K.store.listar(v.vid);
        S.data[v.key] = l;
        S.ready[v.key] = true;
        K.store.aoMudar(v.vid, l2 => { S.data[v.key] = l2; aoMudarDados(v); });
      })();
      S.loading[v.key].catch(() => { S.loading[v.key] = null; });
    }
    return S.loading[v.key];
  }

  function aoMudarDados(v) {
    refreshBadges(v);
    const R = S.route;
    if (R.v !== v.key || S.busy || S.restoring) return;
    if (R.r === 'fila') refreshQueue(v);
    else if (R.r === 'painel' || R.r === 'acompanhar') renderKeep();
    else if (R.r === 'pedido') renderKeep();
    else if (R.r === 'registrar') { const pp = $('#prev-proto'); if (pp) pp.textContent = peekProto(v); }
  }

  // Redesenha mantendo o foco no campo de texto em uso (o texto já está no estado).
  function renderKeep() {
    const a = document.activeElement, id = a && a.id, sel = a && typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null;
    render();
    if (id) { const b = document.getElementById(id); if (b) { b.focus({ preventScroll: true }); if (sel && b.setSelectionRange) try { b.setSelectionRange(sel[0], sel[1]); } catch (e) { /* nada */ } } }
  }

  /* ---------------------------------------------------------- pedidos e prazos */
  function dl(p) {

  }
  const stLabel = p => M.rotuloEstadoPedido(p);
  const pillHTML = p => `<span class="pill pill-${ST[p.estado]}">${ic(ST_IC[p.estado])}${esc(stLabel(p))}</span>`;
  const SEAL_IC = { crit: 'alerta', today: 'relogio', soon: 'relogio', done: 'check', late: 'check' };
  const sealHTML = d => `<span class="seal seal-${d.k}">${d.k === 'ok' ? '<span class="dot" aria-hidden="true"></span>' : ic(SEAL_IC[d.k])}${esc(d.label)}</span>`;
  function rulerHTML(v, p, d) {
    const r = M.regua(p, agora()), tipo = tipoDe(v, p);
    const lab = d.k === 'crit' ? `${d.label}. Prazo de ${M.rotuloPrazo(tipo.prazo)}.` : r.rotulo + '.';

  const idExtra = (v, who) => (who && who.id && whoInfo(v, who).indexOf(who.id) < 0 ? who.id : '');
  function whoInfo(v, who) {
    if (v.key === 'edu') return who.info;

  }
  function chanHTML(v, p) {
    return `<span class="chan">${ic(CH_IC[p.canal])}${esc(chLabel(v, p.canal))}${abertoPelaIA(p) ? ' <span class="tag-ia" title="Aberto pelo atendimento automático">IA</span>' : ''}</span>`;
  }

    const d = dl(p);

  }
  const porUrgencia = (a, b) => urg(a) - urg(b) || (a.vencimento < b.vencimento ? -1 : a.vencimento > b.vencimento ? 1 : 0) || (a.protocolo < b.protocolo ? -1 : 1);
  function openMsg(v, p, venc) {
    const t = tipoDe(v, p), un = t.prazo.unidade;

    return `Olá, ${quem(p).curto}! ${de} foi aberto com o protocolo ${p.protocolo}. O prazo é de ${M.rotuloPrazo(t.prazo)}, até ${ate}. Você pode acompanhar pelo protocolo.`;
  }
  function peekProto(v) { return M.novoProtocolo(v.vid, M.proximoSequencial(lista(v), v.vid)); }

  // Linha do tempo: o histórico gravado + o que a abertura implica + os alertas do monitor de prazo.
  function buildEvents(v, p) {

    if (p.canal === 'whatsapp') push(t0 + 60000, { k: 'reply', by: ia ? T.autores.ia : (p.aberto_por || ab.autor), t: openMsg(v, p, vencOrig) }, 2);
    else push(t0 + 60000, { k: 'sys', ic: 'info', title: 'Protocolo e prazo informados', t: p.canal === 'telefone' ? `Informados ${aoA(g)} ${role} durante a ligação.` : `Informados ${aoA(g)} ${role} no atendimento presencial.` }, 2);
    const primeira = h.find(e => e.acao === 'atribuicao');

    h.forEach(e => {

  /* ---------------------------------------------------------- roteamento */
  function parse() {

  function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

  /* ---------------------------------------------------------- aviso do modo e restauração */

  }

  /* ---------------------------------------------------------- calendário */

  const hhmm = min => pad(Math.floor(min / 60)) + ':' + pad(min % 60);
  function textoCalendario() {
    const cals = ORDER.map(k => M.calendarioDe(V[k].vid));
    const local = cals.every(c => c.municipio === 'Curitiba') ? 'de Curitiba' : 'municipais';
    const pfTodos = cals.every(c => c.pontos_facultativos), pfNenhum = cals.every(c => !c.pontos_facultativos);
    const mesma = cals.every(c => c.inicioMin === cals[0].inicioMin && c.fimMin === cals[0].fimMin);
    const base = mesma ? `Prazos em dias úteis vencem às ${hhmm(cals[0].fimMin)} do último dia; ` : 'Prazos em dias úteis vencem no fim do expediente do último dia; ';
    const conta = pfTodos ? `sábado, domingo, feriados nacionais e ${local}, Carnaval e Corpus Christi não contam.`
      : pfNenhum ? `sábado, domingo e feriados nacionais e ${local} não contam.`
      : `sábado, domingo e feriados nacionais e ${local} não contam, e Carnaval e Corpus Christi dependem do cenário.`;
    const horas = mesma ? ` Prazos em horas contam só horas úteis, das ${hhmm(cals[0].inicioMin)} às ${hhmm(cals[0].fimMin)} dos dias úteis.`
      : ' Prazos em horas contam só horas úteis, no expediente de cada cenário.';
    return base + conta + horas;
  }
  // Feriados e pontos facultativos em dia de semana entre a abertura e o vencimento: "12/10 (Nossa Senhora Aparecida)".
  function feriadosNoPrazo(p) {
    const out = [], fim = D(p.vencimento);
    let d = new Date(D(p.aberto_em).getFullYear(), D(p.aberto_em).getMonth(), D(p.aberto_em).getDate());
    for (let i = 0; d <= fim && i < 400; i++) {
      const w = d.getDay(), f = w !== 0 && w !== 6 ? M.feriadoEm(d, p.vertical) : null;
      if (f) out.push(fD(d) + ' (' + f.nome + ')');
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    }
    return out;
  }

  function navItems(v) {

  /* ---------------------------------------------------------- fila */
  function F(v) { if (!S.filters[v.key]) S.filters[v.key] = { estado: 'abertos', prazo: 'todos', canal: 'todos', q: '', flag: null }; return S.filters[v.key]; }
  function filtered(v) {
    const f = F(v), q = norm(f.q.trim());
    return lista(v).filter(r => {
      if (f.estado === 'abertos' && r.estado === 'concluido') return false;
      if (!['abertos', 'todos'].includes(f.estado) && r.estado !== f.estado) return false;
      if (f.prazo !== 'todos' && dl(r).k !== f.prazo) return false;
      if (f.canal !== 'todos' && r.canal !== f.canal) return false;
      if (f.flag === 'semresp' && r.responsavel) return false;
      if (q && !norm(r.protocolo + ' ' + quem(r).nome + ' ' + tipoDe(v, r).nome + ' ' + (r.responsavel || '')).includes(q)) return false;
      return true;
    }).sort(porUrgencia);
  }
  function counts(v) {
    const o = openReqs(v);
    return { open: o.length, crit: o.filter(r => dl(r).k === 'crit').length, today: o.filter(r => dl(r).k === 'today').length,
             semresp: o.filter(r => !r.responsavel).length, wait: o.filter(r => r.estado === 'aguardando').length };
  }

  // Grava um pedido alterado pelo motor. Só avisa sucesso depois que o store confirma.
  async function salvarPedido(v, novo) {

    } catch (e) {
      toast((e && e.texto) || 'Não foi possível salvar a alteração. Tente de novo.', 'err');

  }
  async function acao(fn) {

  async function setState(v, r, st, foco) {

  }

  /* ---------------------------------------------------------- registro rápido */
  function R_(v) { if (!S.reg[v.key]) S.reg[v.key] = { ch: 'telefone', who: null, q: '', type: null, note: '', resp: 'auto', t0: null, done: null, err: {}, hi: 0 }; return S.reg[v.key]; }
  function people(v) {
    const seen = new Set(), out = [];
    lista(v).map(r => quem(r)).concat(v.roster).forEach(w => { if (w && w.nome && !seen.has(w.nome)) { seen.add(w.nome); out.push(w); } });
    return out;
  }
  function suggestions(v) {
    const R = R_(v), q = norm(R.q.trim());

    const L = people(v).filter(w => norm(w.nome + ' ' + (w.info || '') + ' ' + (w.id || '')).includes(q)).slice(0, 6).map(w => ({ w }));
    if (R.q.trim().length >= 3 && (!L.length || /\s/.test(R.q.trim())) && !L.some(x => norm(x.w.nome) === q)) L.push({ novo: true, name: R.q.trim() });
    return L;
  }

    return `<div class="page-h"><div><h1>Registrar pedido</h1><p class="sub">Por telefone ou ${esc(v.inPersonReg)}. O protocolo e o prazo saem na hora.</p></div>
    <span class="timer${R.t0 ? ' run' : ''}" id="reg-timer">${ic('relogio')}Tempo de registro <span class="mono" id="reg-secs">${fmtSecs(R.t0 ? Math.floor((Date.now() - R.t0) / 1000) : 0)}</span></span></div>
  <div class="reg-grid">

        <button type="button" class="seg-btn" role="radio" aria-checked="${R.ch === 'balcao'}" data-act="reg-ch" data-ch="balcao" id="ch-balcao">${ic('balcao')}${esc(v.inPerson)}</button></div></div>
      <div class="field">${whoField}${R.err.who ? `<p class="err" id="err-who">${ic('alerta', 'ic-sm')}${esc(R.err.who)}</p>` : ''}</div>

      ${sel('reg-resp', 'Responsável', respOpts, R.resp)}
      ${R.err.geral ? `<p class="err" id="err-geral" role="alert">${ic('alerta', 'ic-sm')}${esc(R.err.geral)}</p>` : ''}
      <div class="reg-foot"><button type="submit" class="btn btn-primary btn-lg" id="reg-submit">${ic('check')}Registrar pedido</button><span class="hint"><span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> registra de qualquer campo</span></div>
    </form></section>
    <aside class="panel" aria-label="Prévia do que ${art(g)} ${esc(role)} recebe">
      <div class="panel-h"><h2>O que ${art(g)} ${esc(role)} recebe</h2></div>
      <div class="preview">
        <div><p class="eyebrow">Protocolo</p><p class="proto" id="prev-proto">${esc(proto)}</p></div>
        <div><p class="eyebrow">Prazo</p><p><strong>${Ty ? esc(cap(M.formatarAte(due, Ty.prazo.unidade, agora(), false))) : 'Escolha o tipo de pedido'}</strong></p>${Ty ? `<p class="hint">${esc(Ty.nome)}: ${esc(M.rotuloPrazo(Ty.prazo))}</p>` : ''}</div>
        <div><p class="eyebrow">${R.ch === 'telefone' ? 'Para ler ao telefone' : 'Para entregar por escrito'}</p><p class="msg-prev">${esc(msg)}</p></div>
      </div>
    </aside>
  </div>`;
  }
  const fmtSecs = s => pad(Math.floor(s / 60)) + ':' + pad(s % 60);
  function regTouch(v) { const R = R_(v); if (!R.t0) { R.t0 = Date.now(); const t = $('#reg-timer'); if (t) t.classList.add('run'); } }
  let regInt = null;
  function regTimerSync(v) {
    clearInterval(regInt);
    regInt = setInterval(() => {
      const R = S.route.v === v.key && S.route.r === 'registrar' ? R_(v) : null;
      const el = $('#reg-secs');
      if (!R || !el) { clearInterval(regInt); return; }
      if (R.t0 && !R.done) el.textContent = fmtSecs(Math.floor((Date.now() - R.t0) / 1000));
    }, 250);
  }
  async function regSubmit(v) {
    const R = R_(v); R.err = {};
    const ta = $('#reg-note'); if (ta) R.note = ta.value;
    if (!R.who) R.err.who = `Escolha ${art('m')} ${v.gen.sing} ou cadastre um novo.`;
    if (!R.type) R.err.type = 'Escolha o tipo de pedido.';
    if (R.err.who || R.err.type) { render(); const f = R.err.who ? ($('#reg-q') || $('#reg-unpick')) : $('.type-btn'); if (f) f.focus(); return; }
    const Ty = v.types.find(t => t.id === R.type);
    const resp = R.resp === 'auto' ? autoResp(v) : R.resp;
    const who = R.who;
    let res;
    try {
      res = await K.store.criarPedido(v.vid, {
        tipo_id: Ty.id, canal: R.ch, descricao: R.note,
        solicitante: { nome: who.nome, curto: who.curto || null, genero: who.genero, papel: who.papel, info: who.info, id: who.id },
        dados: [[cap(papel(v, who)), who.nome], ['Cadastro', who.info || 'Novo cadastro'], ['Identificação', who.id || 'Sem identificação']],
        responsavel: resp, aberto_por: v.user.n, autor: v.user.n, novo: true
      });
    } catch (e) {
      const campo = e && e.campo;
      if (campo === 'descricao') R.err.desc = e.texto;
      else if (campo === 'solicitante_rotulo') R.err.who = e.texto;
      else if (campo === 'tipo_id') R.err.type = e.texto;
      else R.err.geral = (e && e.texto) || 'Não foi possível registrar o pedido. Tente de novo.';
      render();
      const f = R.err.desc ? $('#reg-note') : R.err.who ? ($('#reg-q') || $('#reg-unpick')) : R.err.type ? $('.type-btn') : $('#reg-submit');
      if (f) f.focus();
      return;
    }
    if (res.caiuParaLocal && res.aviso) toast(res.aviso, 'info');
    const p = res.pedido;
    const secs = R.t0 ? Math.max(1, Math.round((Date.now() - R.t0) / 1000)) : 0;
    R.done = { p: p.protocolo, secs, due: p.vencimento, un: Ty.prazo.unidade, type: Ty.nome, resp: p.responsavel || 'sem responsável', g: who.genero, role: papel(v, who) };

  }
  function regDoneHTML(v) {

    ${Dn.secs ? `<p class="timer run">${ic('relogio')}Registrado em <span class="mono">${Dn.secs} ${pl(Dn.secs, 'segundo', 'segundos')}</span></p>` : ''}
    <p class="hint">Informe o protocolo ${aoA(Dn.g)} ${esc(Dn.role)}: com ele, dá para acompanhar o pedido sem ligar.</p>
    <div class="page-h-actions"><a class="btn btn-primary" href="#${v.key}.pedido.${esc(Dn.p)}" id="reg-open">Abrir pedido</a><button type="button" class="btn" data-act="copy" data-txt="${esc(Dn.p)}">${ic('copiar')}Copiar protocolo</button><button type="button" class="btn btn-quiet" data-act="reg-new">${ic('mais')}Registrar outro</button></div>
  </div></section>`;
  }

  /* ---------------------------------------------------------- atendimento automático (simulação) */
  const CST = {
    nova: { c: 'cst-new', i: 'chat' },
    bot: { c: 'cst-ia', i: 'ia' },
    pedido_aberto: { c: 'cst-ok', i: 'check' },
    resolvida: { c: 'cst-ok', i: 'check' },
    aguardando_humano: { c: 'cst-wait', i: 'passar', pulse: true },
    humano: { c: 'cst-hum', i: 'pausa' },
    devolvida: { c: 'cst-ia', i: 'ia' },
    pausada: { c: 'cst-hum', i: 'pausa' }
  };
  const cstShort = st => { const x = CST[st] || CST.bot; return `<span class="cst ${x.c} ctab-cst">${x.pulse ? '<span class="pulse" aria-hidden="true"></span>' : ic(x.i)}<span class="cl">${esc(T.ia.estados_curto[st] || '')}</span></span>`; };
  const cstHTML = st => { const x = CST[st] || CST.bot; return `<span class="cst ${x.c}">${x.pulse ? '<span class="pulse" aria-hidden="true"></span>' : ic(x.i)}${esc(T.ia.estados_conversa[st] || '')}</span>`; };
  function simOf(v) {
    if (!S.ia[v.key]) {
      // antes de iniciar: cada conversa mostra a primeira mensagem do roteiro
      S.ia[v.key] = { sessao: null, started: false, paused: false, allDone: false, vistas: {},
        convs: v.convs.map((c, i) => ({ id: 'previa-' + i, estado: 'nova', assunto: c.assunto, solicitante: c.solicitante, protocolo: null,
          aguardando: null, rascunho: null, digitando: false, terminada: false, previa: true,
          mensagens: [{ autor: 'solicitante', texto: M.preencher(c.passos[0].texto, { saudacao: M.saudacao(agora()), saudacao_despedida: M.saudacao(agora()) }), em: null }] })) };
    }
    return S.ia[v.key];
  }
  function registrarLogIA(v, ev) {
    const log = logIA(v);
    const guardar = ev.tipo === 'pedido_aberto' || ev.tipo === 'passou_para_humano' || ev.tipo === 'resolvido' ||
      (ev.tipo === 'mensagem' && (ev.autor === 'solicitante' || ev.autor === 'ia') &&
       !log.some(x => x.conversaId === ev.conversaId && x.tipo === 'mensagem' && x.autor === ev.autor));
    if (!guardar) return;
    log.push({ tipo: ev.tipo, conversaId: ev.conversaId, em: ev.em, autor: ev.autor || null, por: ev.por || null });
    if (log.length > 600) log.splice(0, log.length - 600);
    gravarLS('ia_' + v.vid, log);
  }
  function aoEventoIA(v, ev) {
    const s = S.ia[v.key];
    if (!s || !s.sessao || ev.conversaId.indexOf(s.sessao.id) !== 0) return;
    const idx = s.convs.findIndex(c => c.id === ev.conversaId);
    if (idx < 0) return;
    s.convs[idx] = ev.conversa;
    registrarLogIA(v, ev);
    if (ev.tipo === 'passou_para_humano') announce(`Conversa com ${ev.conversa.solicitante.nome} aguardando uma pessoa da equipe.`);
    s.allDone = s.convs.every(c => c.terminada);
    changed(v, idx);
  }
  function simStart(v) {
    const s = simOf(v);
    if (s.started && s.paused) { K.iaSimulada.continuarSimulacao(v.vid); s.paused = false; return; }
    if (s.started) return;
    s.started = true; s.paused = false; s.allDone = false; s.vistas = {};
    const sess = K.iaSimulada.iniciar(v.vid, ev => aoEventoIA(v, ev), { store: K.store, ritmoMs: S.ritmo });
    s.sessao = sess;
    s.convs = sess.conversas;
  }
  function simReset(v) {
    K.iaSimulada.parar(v.vid);
    delete S.ia[v.key];
    simOf(v);
    simStart(v);
  }
  function msgHTML(v, conv, m, fresh) {
    const enter = fresh ? ' msg-enter' : '';
